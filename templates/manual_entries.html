<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>手動データ管理 - 歩数 / 睡眠</title>
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* 小さな表スタイル（既存 theme.css と競合しない簡易スタイル） */
    table { border-collapse: collapse; width: 100%; margin-bottom: 0.5rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
    input[type="text"], input[type="number"], input[type="date"] { width: 100%; box-sizing: border-box; }
    .btn { padding: 0.4rem 0.8rem; margin-right: 0.4rem; }
  </style>
</head>
<body>
  <main>
    <h1>手動データ管理（管理者用）</h1>
    <p>管理者トークンを持つユーザーのみアクセスできます。</p>

    <section>
      <h2>歩数データ（date / steps）</h2>
      <table id="steps-table" aria-label="steps-table">
        <thead>
          <tr><th>日付</th><th>歩数</th><th>メモ</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="add-step-row" class="btn">行を追加</button>
      <button id="load-steps" class="btn">最近50日を読み込み</button>
      <button id="save-steps" class="btn">保存（まとめて送信）</button>
    </section>

    <section style="margin-top:1.5rem">
      <h2>睡眠データ（date / duration（分） / score）</h2>
      <table id="sleep-table" aria-label="sleep-table">
        <thead>
          <tr><th>日付</th><th>duration (分)</th><th>score (0-100)</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="add-sleep-row" class="btn">行を追加</button>
      <button id="load-sleep" class="btn">最近50日を読み込み</button>
      <button id="save-sleep" class="btn">保存（まとめて送信）</button>
    </section>

    <div id="status" role="status" style="margin-top:1rem;color:#333"></div>
    <p style="margin-top:1rem;color:#666">注意: 同じ日付があれば上書きされます。CSV の一括取り込みは既存のインポート機能を使ってください。</p>
  </main>

  <script src="/static/manual_entries.js"></script>
</body>
</html>
