<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>通院メモ（閲覧用）</title>
<meta name="theme-color" content="#3a6ea5">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .chart-box { height: 400px; position: relative; }
  #chartsContainer { background: var(--bg-elevated); padding: 8px; border-radius: var(--radius-sm); transition: background var(--t); }
  .download-row { margin-top: 12px; }

  /* Record section: entry list (left) + selected entry detail (right),
     mirroring the edit page's layout. */
  .app {
    display: grid;
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 560px;
    overflow-y: auto;
    margin: -2px;
    padding: 2px;
  }
  .entry-row {
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    padding: 8px 10px;
    transition: background var(--t-fast), border-color var(--t-fast);
  }
  .entry-row:hover { background: var(--accent-dim); }
  .entry-row.selected { border-color: var(--accent-soft); background: var(--accent-dim); }
  .entry-top { display: flex; align-items: baseline; gap: 7px; }
  .entry-date { font-size: 0.85rem; font-weight: 600; }
  .entry-weekday { font-size: 0.72rem; color: var(--text-faint); }
  .entry-today {
    font-size: 0.65rem;
    color: var(--accent);
    background: var(--accent-dim);
    border-radius: 999px;
    padding: 1px 7px;
    font-weight: 600;
  }
  .entry-summary {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .detail-card { display: flex; flex-direction: column; gap: 12px; }
  .detail-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .selected-date-label { font-weight: 700; font-size: 1.1rem; }
  .selected-date-weekday { font-size: 0.85rem; color: var(--text-dim); }
  .detail-summary { color: var(--text-dim); font-size: 0.9rem; }
  .entry-content { line-height: 1.6; }
  .entry-content h2 { font-size: 0.95rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .entry-content :first-child { margin-top: 0; }
  .copy-btn { font-size: 0.78rem; padding: 5px 12px; }
</style>
</head>
<body>
<header>
  <h1>🩺 通院メモ（閲覧用）</h1>
  <a class="nav-link ui-fade" href="/edit" target="_blank" rel="noopener">✏️ 編集ページを開く</a>
</header>

<div class="wrap">
  <div class="card">
    <div class="vitals-toolbar">
      <h2 style="margin:0;">バイタル（睡眠・歩数）</h2>
      <div class="period-toggle ui-fade">
        <button class="btn secondary" data-mode="recent">直近50日</button>
        <button class="btn secondary" data-mode="recent100">直近100日</button>
        <button class="btn secondary" data-mode="week">週次</button>
        <button class="btn secondary" data-mode="month">月次</button>
      </div>
    </div>
    <div id="chartsContainer">
      <div class="chart-box"><canvas id="vitalsChart"></canvas></div>
    </div>
    <div class="download-row">
      <button class="btn secondary" id="downloadChartImageBtn">🖼 グラフを画像としてダウンロード</button>
    </div>
  </div>

  <div class="app">
    <div class="card">
      <h2>記録一覧</h2>
      <div class="entry-list" id="entryList"></div>
    </div>

    <div class="card detail-card" id="detailCard">
      <div class="detail-head">
        <span class="selected-date-label" id="selectedDateLabel"></span>
        <span class="selected-date-weekday" id="selectedDateWeekday"></span>
      </div>
      <div class="detail-summary" id="detailSummary"></div>
      <div class="entry-content" id="detailContent"></div>
      <div>
        <button class="btn secondary copy-btn" id="copyBtn">メモをコピー</button>
      </div>
    </div>
  </div>
</div>

<footer>通院メモ（閲覧専用ページ）</footer>

<script src="{{ url_for('static', filename='idle-ui.js') }}"></script>
<script src="{{ url_for('static', filename='vitals-chart.js') }}"></script>
<script>
const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];
const state = {
  entries: [],
  entriesByDate: {},
  selectedDate: null,
  vitals: { sleep: [], steps: [] },
  vitalsMode: 'recent',
};
let vitalsChart;

function fmtDate(d) { return VitalsChart.fmtDate(d); }

function weekdayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAY_JA[d.getDay()];
}

async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GET ${url} failed: ${res.status}`);
  return res.json();
}

// ---------------------------------------------------------------------
// Entry list + detail (read-only)
// ---------------------------------------------------------------------

async function loadEntries() {
  try {
    state.entries = await apiGet('/api/memo?limit=200');
  } catch (e) {
    state.entries = [];
  }
  state.entriesByDate = {};
  state.entries.forEach(m => { state.entriesByDate[m.date] = m; });

  if (!state.selectedDate || !state.entriesByDate[state.selectedDate]) {
    state.selectedDate = state.entries.length ? state.entries[0].date : null; // most recent (API returns DESC)
  }

  renderEntryList();
  renderDetail();
  // loadVitals() runs concurrently and may resolve first — re-render so the
  // clinic-day highlight isn't stuck reflecting an empty entry list.
  renderCharts();
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    const original = btn.textContent;
    btn.textContent = 'コピーしました ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

function renderEntryList() {
  const list = document.getElementById('entryList');
  list.innerHTML = '';

  if (!state.entries.length) {
    list.innerHTML = '<div class="entry-empty">まだ記録がありません。</div>';
    return;
  }

  const today = fmtDate(new Date());

  state.entries.forEach(m => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    if (m.date === state.selectedDate) row.classList.add('selected');
    row.addEventListener('click', () => selectEntry(m.date));

    const top = document.createElement('div');
    top.className = 'entry-top';

    const dateSpan = document.createElement('span');
    dateSpan.className = 'entry-date';
    dateSpan.textContent = m.date;
    top.appendChild(dateSpan);

    const wdSpan = document.createElement('span');
    wdSpan.className = 'entry-weekday';
    wdSpan.textContent = weekdayLabel(m.date);
    top.appendChild(wdSpan);

    if (m.date === today) {
      const todayTag = document.createElement('span');
      todayTag.className = 'entry-today';
      todayTag.textContent = '今日';
      top.appendChild(todayTag);
    }
    row.appendChild(top);

    if (m.summary) {
      const summary = document.createElement('div');
      summary.className = 'entry-summary';
      summary.textContent = m.summary;
      row.appendChild(summary);
    }

    list.appendChild(row);
  });
}

function flashJumpHighlight() {
  const card = document.getElementById('detailCard');
  card.classList.remove('jump-highlight');
  void card.offsetWidth; // restart animation
  card.classList.add('jump-highlight');
}

function selectEntry(dateStr) {
  state.selectedDate = dateStr;
  renderEntryList();
  renderDetail();
  flashJumpHighlight();
}

function renderDetail() {
  const memo = state.selectedDate ? state.entriesByDate[state.selectedDate] : null;

  if (!memo) {
    document.getElementById('selectedDateLabel').textContent = '';
    document.getElementById('selectedDateWeekday').textContent = '';
    document.getElementById('detailSummary').textContent = '';
    document.getElementById('detailContent').innerHTML = '<p class="empty-hint">記録を選択してください。</p>';
    document.getElementById('copyBtn').style.display = 'none';
    return;
  }

  document.getElementById('selectedDateLabel').textContent = memo.date;
  document.getElementById('selectedDateWeekday').textContent = `(${weekdayLabel(memo.date)})`;
  document.getElementById('detailSummary').textContent = memo.summary || '';
  document.getElementById('detailContent').innerHTML = (memo.content || '').trim()
    ? marked.parse(memo.content)
    : '<p style="color:var(--text-faint);">（内容なし）</p>';

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.style.display = '';
  copyBtn.onclick = () => copyToClipboard(memo.content, copyBtn);
}

// ---------------------------------------------------------------------
// Charts (shared logic with the editor page — see static/vitals-chart.js)
// ---------------------------------------------------------------------

function renderCharts() {
  vitalsChart = VitalsChart.renderVitalsChart(
    document.getElementById('vitalsChart'),
    vitalsChart,
    state.entries,
    state.vitals,
    state.vitalsMode
  );
}

async function loadVitals() {
  const { start, end } = VitalsChart.vitalsRangeForMode(state.vitalsMode);
  try {
    state.vitals = await apiGet(`/api/vitals?start=${start}&end=${end}`);
  } catch (e) {
    state.vitals = { sleep: [], steps: [] };
  }
  renderCharts();
}

document.querySelectorAll('.period-toggle [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.vitalsMode = btn.dataset.mode;
    document.querySelectorAll('.period-toggle [data-mode]').forEach(b => b.classList.toggle('active', b === btn));
    loadVitals();
  });
});

document.getElementById('downloadChartImageBtn').addEventListener('click', () => {
  html2canvas(document.getElementById('chartsContainer')).then(canvas => {
    const link = document.createElement('a');
    link.download = `vitals_${state.vitalsMode}_${fmtDate(new Date())}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

document.querySelector('.period-toggle [data-mode="recent"]').classList.add('active');
loadEntries();
loadVitals();
</script>
</body>
</html>
