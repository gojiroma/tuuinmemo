<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>通院メモ（閲覧用）</title>
<meta name="theme-color" content="#3a6ea5">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .chart-box { height: 400px; position: relative; }
  #chartsContainer { background: var(--bg-elevated); padding: 8px; border-radius: var(--radius-sm); transition: background var(--t); }

  .entries-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
  }
  .entry-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    transition: border-color var(--t), background var(--t);
  }
  .entry-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .entry-date { font-weight: 700; font-size: 1rem; }
  .entry-weekday { font-size: 0.8rem; color: var(--text-faint); }
  .entry-summary { color: var(--text-dim); font-size: 0.88rem; }
  .entry-content { line-height: 1.6; margin-top: 8px; }
  .entry-content h2 { font-size: 0.95rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .entry-content :first-child { margin-top: 0; }
  .entry-actions { margin-top: 10px; }
  .copy-btn { font-size: 0.78rem; padding: 5px 12px; }
  .download-row { margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>🩺 通院メモ（閲覧用）</h1>
  <a class="nav-link ui-fade" href="/edit" target="_blank" rel="noopener">✏️ 編集ページを開く</a>
</header>

<div class="wrap">
  <div class="card">
    <div class="vitals-toolbar">
      <h2 style="margin:0;">バイタル（睡眠・歩数）</h2>
      <div class="period-toggle ui-fade">
        <button class="btn secondary" data-mode="recent">直近50日</button>
        <button class="btn secondary" data-mode="week">週次</button>
        <button class="btn secondary" data-mode="month">月次</button>
      </div>
    </div>
    <div id="chartsContainer">
      <div class="chart-box"><canvas id="vitalsChart"></canvas></div>
    </div>
    <div class="download-row">
      <button class="btn secondary" id="downloadChartImageBtn">🖼 グラフを画像としてダウンロード</button>
    </div>
  </div>

  <div class="card">
    <h2>記録一覧</h2>
    <div class="entries-grid" id="entryList"></div>
  </div>
</div>

<footer>通院メモ（閲覧専用ページ）</footer>

<script src="{{ url_for('static', filename='idle-ui.js') }}"></script>
<script src="{{ url_for('static', filename='vitals-chart.js') }}"></script>
<script>
const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];
const state = { entries: [], vitals: { sleep: [], steps: [] }, vitalsMode: 'recent' };
let vitalsChart;

function fmtDate(d) { return VitalsChart.fmtDate(d); }

function weekdayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAY_JA[d.getDay()];
}

async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GET ${url} failed: ${res.status}`);
  return res.json();
}

// ---------------------------------------------------------------------
// Entry list (read-only)
// ---------------------------------------------------------------------

async function loadEntries() {
  try {
    state.entries = await apiGet('/api/memo?limit=200');
  } catch (e) {
    state.entries = [];
  }
  renderEntries();
  // loadVitals() runs concurrently and may resolve first — re-render so the
  // clinic-day highlight isn't stuck reflecting an empty entry list.
  renderCharts();
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    const original = btn.textContent;
    btn.textContent = 'コピーしました ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

function renderEntries() {
  const list = document.getElementById('entryList');
  list.innerHTML = '';

  if (!state.entries.length) {
    list.innerHTML = '<div class="empty-hint">まだ記録がありません。</div>';
    return;
  }

  state.entries.forEach(m => {
    const card = document.createElement('div');
    card.className = 'entry-card';

    const top = document.createElement('div');
    top.className = 'entry-top';
    top.innerHTML = `<span class="entry-date">${m.date}</span><span class="entry-weekday">(${weekdayLabel(m.date)})</span>`;
    card.appendChild(top);

    if (m.summary) {
      const summary = document.createElement('div');
      summary.className = 'entry-summary';
      summary.textContent = m.summary;
      card.appendChild(summary);
    }

    const content = document.createElement('div');
    content.className = 'entry-content';
    content.innerHTML = (m.content || '').trim() ? marked.parse(m.content) : '<p style="color:var(--text-faint);">（内容なし）</p>';
    card.appendChild(content);

    const actions = document.createElement('div');
    actions.className = 'entry-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn secondary copy-btn';
    copyBtn.textContent = 'メモをコピー';
    copyBtn.addEventListener('click', () => copyToClipboard(m.content, copyBtn));
    actions.appendChild(copyBtn);
    card.appendChild(actions);

    list.appendChild(card);
  });
}

// ---------------------------------------------------------------------
// Charts (shared logic with the editor page — see static/vitals-chart.js)
// ---------------------------------------------------------------------

function renderCharts() {
  vitalsChart = VitalsChart.renderVitalsChart(
    document.getElementById('vitalsChart'),
    vitalsChart,
    state.entries,
    state.vitals,
    state.vitalsMode
  );
}

async function loadVitals() {
  const { start, end } = VitalsChart.vitalsRangeForMode(state.vitalsMode);
  try {
    state.vitals = await apiGet(`/api/vitals?start=${start}&end=${end}`);
  } catch (e) {
    state.vitals = { sleep: [], steps: [] };
  }
  renderCharts();
}

document.querySelectorAll('.period-toggle [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.vitalsMode = btn.dataset.mode;
    document.querySelectorAll('.period-toggle [data-mode]').forEach(b => b.classList.toggle('active', b === btn));
    loadVitals();
  });
});

document.getElementById('downloadChartImageBtn').addEventListener('click', () => {
  html2canvas(document.getElementById('chartsContainer')).then(canvas => {
    const link = document.createElement('a');
    link.download = `vitals_${state.vitalsMode}_${fmtDate(new Date())}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

document.querySelector('.period-toggle [data-mode="recent"]').classList.add('active');
loadEntries();
loadVitals();
</script>
</body>
</html>
