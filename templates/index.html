<html lang="ja">
<head>
<meta charset="utf-8">

<style>
  .app {
    display: grid;
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    padding-bottom: 0;
    align-items: start;
    max-width: 1180px;
    margin: 0 auto;

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }

  /* Entry list -------------------------------------------------- */
  .jump-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .jump-row input[type=date] { flex: 1; }
  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 460px;
    overflow-y: auto;
    margin: -2px;
    padding: 2px;
  }
  .entry-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    transition: background var(--t-fast), border-color var(--t-fast);
  }
  .entry-row:hover { background: var(--accent-dim); }
  .entry-row.selected { border-color: var(--accent-soft); background: var(--accent-dim); }
  .entry-main { flex: 1; min-width: 0; cursor: pointer; padding: 8px 4px 8px 10px; }
  .entry-top { display: flex; align-items: baseline; gap: 7px; }
  .entry-date { font-size: 0.85rem; font-weight: 600; }
  .entry-weekday { font-size: 0.72rem; color: var(--text-faint); }
  .entry-today {
    font-size: 0.65rem;
    color: var(--accent);
    background: var(--accent-dim);
    border-radius: 999px;
    padding: 1px 7px;
    font-weight: 600;
  }
  .entry-summary {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .entry-delete {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text-faint);
    font-size: 0.85rem;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--t-fast), background var(--t-fast), color var(--t-fast);
  }
  .entry-row:hover .entry-delete,
  .entry-row:focus-within .entry-delete { opacity: 1; }
  .entry-delete:hover { background: var(--danger-dim); color: var(--danger); }
  .entry-empty { font-size: 0.82rem; color: var(--text-dim); padding: 8px 4px; }

  /* Editor card --------------------------------------------------- */
  .editor-card { display: flex; flex-direction: column; gap: 12px; }
  .editor-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .selected-date-label { font-weight: 700; font-size: 1.1rem; }
  .selected-date-weekday { font-size: 0.85rem; color: var(--text-dim); }
  #summaryInput {
    border: none;
    border-bottom: 1px solid var(--border-soft);
    border-radius: 0;
    padding: 4px 2px;
    background: transparent;
  }
  #summaryInput:focus { border-bottom-color: var(--accent); }

  .editor-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .editor-toolbar .group { display: flex; gap: 6px; flex-wrap: wrap; }
  .editor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) {
    .editor-split { grid-template-columns: 1fr; }
  }
  #contentEdit { width: 100%; min-height: 380px; resize: vertical; line-height: 1.55; }
  #contentView {
    min-height: 380px;
    max-height: 620px;
    overflow-y: auto;
    line-height: 1.65;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    background: var(--bg-elevated);
    transition: background var(--t), border-color var(--t);
  }
  #contentView h2 { font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #contentView :first-child { margin-top: 0; }
  .status-row { display: flex; justify-content: flex-end; align-items: center; }
  #saveStatus { font-size: 0.78rem; color: var(--text-faint); transition: color var(--t); min-height: 1em; }
  #saveStatus.saved { color: var(--success); }
  #saveStatus.pending { color: var(--text-dim); }
  #saveStatus.offline { color: var(--danger); }

  /* Vitals section ------------------------------------------------ */
  .vitals-section { padding: 16px; max-width: 1180px; margin: 0 auto; }
  .vitals-card { max-width: none; }
  .vitals-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .chart-box { height: 440px; position: relative; }
  #chartsContainer { background: var(--bg-elevated); padding: 8px; border-radius: var(--radius-sm); transition: background var(--t); }
  .external-link-row { margin-top: 12px; }
  .external-link-row a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .import-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .import-row label.btn { display: inline-block; }
  .import-row input[type=file] { display: none; }
</style>

<script src="{{ url_for('static', filename='idle-ui.js') }}"></script>
<script src="{{ url_for('static', filename='vitals-chart.js') }}"></script>
<script src="{{ url_for('static', filename='markdown-editor.js') }}"></script>
<script>
const TEMPLATE = `## 生活変化

## 体調

## 今後の意向

## 質問・相談・依頼
`;

const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

const state = {
  selectedDate: VitalsChart.fmtDate(new Date()),
  entries: [],
  entriesByDate: {},
  vitals: { sleep: [], steps: [] },
  vitalsMode: 'recent',
  currentMemoId: null,
};

let vitalsChart;

function fmtDate(d) { return VitalsChart.fmtDate(d); }
function addDays(dateStr, n) { return VitalsChart.addDays(dateStr, n); }

function weekdayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAY_JA[d.getDay()];
}

function firstLine(content) {
  if (!content) return '';
  const line = (content.split('\n').find(l => l.trim()) || '');
  return line.replace(/^#+\s*/, '').replace(/^-\s*/, '').trim();
}

// ---------------------------------------------------------------------
// Networking + offline cache
// ---------------------------------------------------------------------

async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GET ${url} failed: ${res.status}`);
  return res.json();
}

async function loadEntries() {
  try {
    const entries = await apiGet('/api/memo?limit=200');
    state.entries = entries;
    state.entriesByDate = {};
    entries.forEach(m => { state.entriesByDate[m.date] = m; });
    localStorage.setItem('cache:entries', JSON.stringify(entries));
    setStatus('オンライン', false);
  } catch (e) {
    console.warn('offline, using cache', e);
    const cached = JSON.parse(localStorage.getItem('cache:entries') || '[]');
    state.entries = cached;
    state.entriesByDate = {};
    cached.forEach(m => { state.entriesByDate[m.date] = m; });
    setStatus('オフライン（キャッシュ表示）', true);
  }
  renderEntryList();
  // loadVitals() runs concurrently and may resolve first — re-render so the
  // clinic-day highlight isn't stuck reflecting an empty entry list.
  renderCharts();
}

function setStatus(text, offline) {
  const badge = document.getElementById('statusBadge');
  badge.textContent = text;
  badge.classList.toggle('offline', !!offline);
}

function draftKey(dateStr) {
  return `draft:${dateStr}`;
}

function saveDraft(dateStr, data) {
  localStorage.setItem(draftKey(dateStr), JSON.stringify({ ...data, savedAt: Date.now() }));
}

function getDraft(dateStr) {
  const raw = localStorage.getItem(draftKey(dateStr));
  return raw ? JSON.parse(raw) : null;
}

function clearDraft(dateStr) {
  localStorage.removeItem(draftKey(dateStr));
}

async function syncPendingDrafts() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('draft:'));
  for (const key of keys) {
    const dateStr = key.slice('draft:'.length);
    const draft = JSON.parse(localStorage.getItem(key));
    try {
      const res = await fetch('/api/memo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date: dateStr,
          summary: draft.summary,
          content: draft.content,
        }),
      });
      if (res.ok) clearDraft(dateStr);
    } catch (e) {
      break; // still offline, stop trying
    }
  }
  loadEntries();
}

window.addEventListener('online', () => { setStatus('オンライン', false); syncPendingDrafts(); });
window.addEventListener('offline', () => setStatus('オフライン', true));

// ---------------------------------------------------------------------
// Entry list
// ---------------------------------------------------------------------

function renderEntryList() {
  const list = document.getElementById('entryList');
  list.innerHTML = '';

  if (!state.entries.length) {
    list.innerHTML = '<div class="entry-empty">まだエントリがありません。日付を選んで作成してください。</div>';
    return;
  }

  const today = fmtDate(new Date());

  state.entries.forEach(m => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    if (m.date === state.selectedDate) row.classList.add('selected');

    const main = document.createElement('div');
    main.className = 'entry-main';
    main.addEventListener('click', () => selectDate(m.date));

    const top = document.createElement('div');
    top.className = 'entry-top';

    const dateSpan = document.createElement('span');
    dateSpan.className = 'entry-date';
    dateSpan.textContent = m.date;
    top.appendChild(dateSpan);

    const wdSpan = document.createElement('span');
    wdSpan.className = 'entry-weekday';
    wdSpan.textContent = weekdayLabel(m.date);
    top.appendChild(wdSpan);

    if (m.date === today) {
      const todayTag = document.createElement('span');
      todayTag.className = 'entry-today';
      todayTag.textContent = '今日';
      top.appendChild(todayTag);
    }
    main.appendChild(top);

    const preview = document.createElement('div');
    preview.className = 'entry-summary';
    preview.textContent = m.summary || firstLine(m.content) || '（内容なし）';
    main.appendChild(preview);

    row.appendChild(main);

    const delBtn = document.createElement('button');
    delBtn.className = 'entry-delete';
    delBtn.type = 'button';
    delBtn.setAttribute('aria-label', `${m.date} のメモを削除`);
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteEntry(m.date);
    });
    row.appendChild(delBtn);

    list.appendChild(row);
  });
}

function flashJumpHighlight() {
  const card = document.getElementById('editorCard');
  card.classList.remove('jump-highlight');
  void card.offsetWidth; // restart animation
  card.classList.add('jump-highlight');
}

function selectDate(dateStr) {
  state.selectedDate = dateStr;
  document.getElementById('jumpDateInput').value = dateStr;
  renderEntryList();
  loadEditorForSelectedDate();
  flashJumpHighlight();
}

function loadEditorForSelectedDate() {
  const dateStr = state.selectedDate;
  document.getElementById('selectedDateLabel').textContent = dateStr;
  document.getElementById('selectedDateWeekday').textContent = `(${weekdayLabel(dateStr)})`;
  const memo = state.entriesByDate[dateStr];
  const draft = getDraft(dateStr);

  const base = draft || memo || { summary: '', content: '' };
  state.currentMemoId = memo ? memo.id : null;

  document.getElementById('summaryInput').value = base.summary || '';
  document.getElementById('contentEdit').value = base.content || '';

  setSaveStatus(draft ? '未同期の下書きがあります' : '', draft ? 'offline' : '');
  updatePreview();
}

document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = document.getElementById('jumpDateInput').value;
  if (v) selectDate(v);
});

// ---------------------------------------------------------------------
// Editor
// ---------------------------------------------------------------------

function updatePreview() {
  const content = document.getElementById('contentEdit').value;
  document.getElementById('contentView').innerHTML = content.trim()
    ? marked.parse(content)
    : '<p style="color:var(--text-faint);">（内容なし）</p>';
}

function setSaveStatus(text, kind) {
  const el = document.getElementById('saveStatus');
  el.textContent = text;
  el.classList.remove('saved', 'pending', 'offline');
  if (kind) el.classList.add(kind);
}

function currentFormData() {
  return {
    summary: document.getElementById('summaryInput').value,
    content: document.getElementById('contentEdit').value,
  };
}

// ---------------------------------------------------------------------
// Autosave (no manual save button: every edit is persisted automatically)
// ---------------------------------------------------------------------

let autosaveTimer = null;

function onFormInput() {
  setSaveStatus('入力中…', 'pending');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveNow, 700);
}

async function autosaveNow() {
  const dateStr = state.selectedDate;
  const payload = currentFormData();

  if (!payload.summary && !payload.content && !state.currentMemoId) {
    clearDraft(dateStr);
    setSaveStatus('', '');
    return;
  }

  setSaveStatus('保存中…', 'pending');
  try {
    const res = await fetch('/api/memo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateStr, ...payload }),
    });
    if (!res.ok) throw new Error(await res.text());
    const memo = await res.json();
    state.entriesByDate[dateStr] = memo;
    if (!state.entries.some(m => m.date === dateStr)) {
      state.entries.unshift(memo);
      state.entries.sort((a, b) => b.date.localeCompare(a.date));
    } else {
      state.entries = state.entries.map(m => m.date === dateStr ? memo : m);
    }
    state.currentMemoId = memo.id;
    clearDraft(dateStr);
    setSaveStatus('保存しました ✓', 'saved');
    renderEntryList();
    renderCharts();
  } catch (e) {
    saveDraft(dateStr, payload);
    setSaveStatus('オフラインのため下書き保存しました', 'offline');
  }
}

document.getElementById('summaryInput').addEventListener('input', onFormInput);
document.getElementById('contentEdit').addEventListener('input', onFormInput);
document.getElementById('contentEdit').addEventListener('input', updatePreview);
document.getElementById('contentEdit').addEventListener('keydown', function (e) {
  applyMarkdownEditorKeydown(this, e);
});
document.getElementById('contentEdit').addEventListener('focus', () => document.body.classList.add('editor-focused'));
document.getElementById('contentEdit').addEventListener('blur', () => document.body.classList.remove('editor-focused'));

document.getElementById('templateBtn').addEventListener('click', () => {
  const el = document.getElementById('contentEdit');
  if (!el.value.trim()) {
    el.value = TEMPLATE;
  } else {
    el.value += (el.value.endsWith('\n') ? '' : '\n') + '\n' + TEMPLATE;
  }
  onFormInput();
  updatePreview();
});

async function deleteEntry(dateStr) {
  if (!confirm(`${dateStr} のメモを削除しますか？`)) return;
  clearDraft(dateStr);
  const memo = state.entriesByDate[dateStr];
  if (memo) {
    try {
      await fetch(`/api/memo/${memo.id}`, { method: 'DELETE' });
    } catch (e) {
      setSaveStatus('オフラインのため削除できませんでした', 'offline');
      return;
    }
    delete state.entriesByDate[dateStr];
    state.entries = state.entries.filter(m => m.date !== dateStr);
  }

  if (state.selectedDate === dateStr) {
    document.getElementById('summaryInput').value = '';
    document.getElementById('contentEdit').value = '';
    state.currentMemoId = null;
    setSaveStatus('削除しました', '');
    updatePreview();
  }

  renderEntryList();
  renderCharts();
}

// ---------------------------------------------------------------------
// Combine markdown-embedded images into one vertical PNG
// ---------------------------------------------------------------------

function extractImageUrls(markdown) {
  const urls = [];
  const re = /!\[[^\]]*\]\(\s*(\S+?)(?:\s+"[^"]*")?\s*\)/g;
  let match;
  while ((match = re.exec(markdown))) urls.push(match[1]);
  return urls;
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(url));
    img.src = url;
  });
}

document.getElementById('combineImagesBtn').addEventListener('click', async () => {
  const urls = extractImageUrls(document.getElementById('contentEdit').value);
  if (!urls.length) {
    alert('本文に画像（![alt](URL) 形式）が見つかりませんでした。');
    return;
  }

  let images;
  try {
    images = await Promise.all(urls.map(loadImage));
  } catch (e) {
    alert('画像の読み込みに失敗しました: ' + e.message);
    return;
  }

  const width = Math.max(...images.map(img => img.naturalWidth));
  let y = 0;
  const placed = images.map(img => {
    const scale = width / img.naturalWidth;
    const h = img.naturalHeight * scale;
    const top = y;
    y += h;
    return { img, h, top };
  });

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = Math.max(1, Math.round(y));
  const ctx = canvas.getContext('2d');
  placed.forEach(({ img, h, top }) => ctx.drawImage(img, 0, top, width, h));

  let dataUrl;
  try {
    dataUrl = canvas.toDataURL('image/png');
  } catch (e) {
    alert('画像の結合に失敗しました（外部画像のセキュリティ制限の可能性があります）: ' + e.message);
    return;
  }

  const link = document.createElement('a');
  link.download = `memo_images_${state.selectedDate}.png`;
  link.href = dataUrl;
  link.click();
});

// ---------------------------------------------------------------------
// Charts
// ---------------------------------------------------------------------

function renderCharts() {
  vitalsChart = VitalsChart.renderVitalsChart(
    document.getElementById('vitalsChart'),
    vitalsChart,
    state.entries,
    state.vitals,
    state.vitalsMode
  );
}

async function loadVitals() {
  const { start, end } = VitalsChart.vitalsRangeForMode(state.vitalsMode);
  const cacheK = `cache:vitals:${state.vitalsMode}`;
  try {
    const vitals = await apiGet(`/api/vitals?start=${start}&end=${end}`);
    state.vitals = vitals;
    localStorage.setItem(cacheK, JSON.stringify(vitals));
  } catch (e) {
    state.vitals = JSON.parse(localStorage.getItem(cacheK) || '{"sleep":[],"steps":[]}');
  }
  renderCharts();
}

document.querySelectorAll('.period-toggle [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.vitalsMode = btn.dataset.mode;
    document.querySelectorAll('.period-toggle [data-mode]').forEach(b => b.classList.toggle('active', b === btn));
    loadVitals();
  });
});

document.getElementById('saveChartImageBtn').addEventListener('click', () => {
  html2canvas(document.getElementById('chartsContainer')).then(canvas => {
    const link = document.createElement('a');
    link.download = `vitals_${state.vitalsMode}_${fmtDate(new Date())}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

// ---------------------------------------------------------------------
// CSV import
// ---------------------------------------------------------------------

async function importCsv(inputEl, type) {
  const file = inputEl.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  form.append('type', type);
  try {
    const res = await fetch('/api/vitals/import-csv', { method: 'POST', body: form });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'import failed');
    alert(`${result.imported}件インポートしました（${result.skipped}件スキップ）`);
    loadVitals();
  } catch (e) {
    alert('インポートに失敗しました: ' + e.message);
  }
  inputEl.value = '';
}
