<style>
  .app {
    display: grid;
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    padding-bottom: 0;
    align-items: start;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  /* Older memos, listed below the latest one ------------------- */
  .jump-row { display: flex; gap: 6px; }
  .archive { display: flex; flex-direction: column; margin-top: 28px; }
  .archive-entry { border-top: 1px solid var(--border); padding: 22px 0 10px; }
  .archive-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .archive-date { font-size: 1.05rem; font-weight: 600; }
  .archive-weekday, .archive-ago { font-size: 0.8rem; color: var(--text-faint); }
  .archive-ago { margin-left: auto; }
  body:not(.view-mode) .archive-date { cursor: pointer; }
  body:not(.view-mode) .archive-date:hover { text-decoration: underline; }
  .entry-delete {
    border: none;
    background: transparent;
    color: var(--text-faint);
    font-size: 0.85rem;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .entry-delete:hover { background: var(--danger-dim); color: var(--danger); }

  /* Editor card --------------------------------------------------- */
  .editor-card { display: flex; flex-direction: column; gap: 12px; }
  .editor-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .date-label-group { display: flex; align-items: baseline; gap: 8px; }
  .selected-date-label { font-weight: 700; font-size: 1.1rem; }
  .selected-date-weekday { font-size: 0.85rem; color: var(--text-dim); }
  /* View mode keeps word labels; edit mode shows only the emoji. */
  body.view-mode [data-label] { font-size: 0; }
  body.view-mode [data-label]::after { content: attr(data-label); font-size: 0.84rem; }
  body.view-mode .copy-btn[data-label]::after { font-size: 0.78rem; }
  body.view-mode [data-label].done::after { content: 'コピーしました ✓'; }
  .head-actions { display: flex; gap: 6px; align-items: center; }
  .share-pin[hidden] { display: none; }
  .share-pin { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; margin-right: 4px; }
  .share-pin strong { font-size: 1.15rem; letter-spacing: 0.15em; color: var(--text); font-family: ui-monospace, Menlo, monospace; }
  #sharePinTimer { color: var(--text-faint); font-size: 0.75rem; }
  body.view-mode .share-pin { display: none; }
  #editBackBtn { display: none; }
  body.view-mode.is-admin #editBackBtn { display: inline-block; }
  .copy-btn { display: none; font-size: 0.78rem; padding: 5px 12px; }
  body:not(.view-mode) .copy-btn { display: inline-block; }
  body.view-mode .copy-btn { display: inline-block; }

  .editor-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .editor-toolbar .group { display: flex; gap: 6px; flex-wrap: wrap; }
  /* Edit mode shows the memo as rendered; tapping it swaps in the
     textarea, and leaving the textarea swaps the rendered view back. */
  .editor-split { display: block; }
  #contentEdit { display: none; }
  .editor-card.editing #contentEdit { display: block; }
  .editor-card.editing #contentView { display: none; }
  body:not(.view-mode) #contentView { cursor: text; }
  #contentEdit { width: 100%; min-height: 640px; resize: vertical; line-height: 1.55; }
  #contentView {
    min-height: 640px;
    max-height: 880px;
    overflow-y: auto;
    line-height: 1.65;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    background: var(--bg-elevated);
    transition: background var(--t), border-color var(--t);
  }
  #contentView h2, .memo-body h2 { font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #contentView :first-child, .memo-body :first-child { margin-top: 0; }
  .memo-body { line-height: 1.65; }
  #contentView img, .memo-body img {
    display: block;
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: var(--radius-sm);
    cursor: zoom-in;
    transition: opacity var(--t-fast);
  }
  #contentView .img-frame, .memo-body .img-frame {
    display: inline-block;
    vertical-align: top;
    max-width: 100%;
    margin: 8px 8px 8px 0;
    position: relative;
  }
  #contentView .img-frame:hover img, .memo-body .img-frame:hover img { opacity: 0.85; }
  #contentView .img-hint, .memo-body .img-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 0.78rem;
    border-radius: var(--radius-sm);
    opacity: 0;
    transition: opacity var(--t-fast);
    pointer-events: none;
  }
  #contentView .img-frame:hover .img-hint, .memo-body .img-frame:hover .img-hint { opacity: 1; }
  .status-row { display: flex; justify-content: flex-end; align-items: center; }
  #saveStatus { font-size: 0.78rem; color: var(--text-faint); transition: color var(--t); min-height: 1em; }
  #saveStatus.saved { color: var(--success); }
  #saveStatus.pending { color: var(--text-dim); }
  #saveStatus.offline { color: var(--danger); }


  /* View mode: doctor-facing read-only view of the same page, toggled
     in place instead of navigating to a separate page/URL. */
  body.view-mode .editor-toolbar,
  body.view-mode .entry-delete,
  body.view-mode #saveStatus,
  body.view-mode #contentEdit,
  body.view-mode .hint { display: none; }
  body.view-mode #contentView { max-height: none; }
  body.view-mode .copy-btn { display: inline-block; }

  /* Image lightbox (click a preview image to view it full-size) ---- */
  .lightbox-dialog {
    box-sizing: border-box;
    width: calc(100vw - 24px);
    height: calc(100vh - 24px);
    height: calc(100dvh - 24px);
    max-width: none;
    max-height: none;
    border: none;
    border-radius: var(--radius);
    padding: 0;
    background: #14161a;
    color: #fff;
  }
  .lightbox-dialog[open] { display: flex; flex-direction: column; }
  .lightbox-dialog::backdrop { background: rgba(0, 0, 0, 0.75); }
  .lightbox-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; }
  .lightbox-toolbar .btn.secondary { color: #fff; border-color: rgba(255, 255, 255, 0.5); }
  .lightbox-toolbar .btn.secondary:hover { background: rgba(255, 255, 255, 0.15); }
  .lightbox-counter { font-size: 0.8rem; color: rgba(255, 255, 255, 0.75); }
  .lightbox-body { position: relative; display: flex; flex: 1; align-items: center; justify-content: center; min-height: 0; }
  .lightbox-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    border: none;
    font-size: 1.6rem;
    line-height: 1;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lightbox-nav:hover { background: rgba(0, 0, 0, 0.65); }
  .lightbox-prev { left: 8px; }
  .lightbox-next { right: 8px; }

  /* Access-token gate: covers the whole app until a valid token is supplied,
     so memo content never renders (and its API calls never fire) for
     anyone without the token. */
  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .auth-gate[hidden] { display: none; }
  .auth-gate-card { width: min(360px, 90vw); display: flex; flex-direction: column; gap: 12px; }
  .auth-gate-card[hidden] { display: none; }
  #authInput { width: 100%; font-size: 1.6rem; letter-spacing: 0.3em; text-align: center; }
  #authInput.invalid { border-color: var(--danger); }
  body.auth-locked .app { display: none; }

</style>

<script src="{{ url_for('static', filename='markdown-editor.js') }}"></script>
<script>
const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

const state = {
  selectedDate: fmtDate(new Date()),
  entries: [],
  entriesByDate: {},
  currentMemoId: null,
  role: null, // 'admin' | 'guest', set once the access token is verified
};

function fmtDate(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function weekdayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAY_JA[d.getDay()];
}

function firstLine(content) {
  if (!content) return '';
  const line = (content.split('\n').find(l => l.trim()) || '');
  return line.replace(/^#+\s*/, '').replace(/^-\s*/, '').trim();
}

// ---------------------------------------------------------------------
// Access-token gate: nothing under /api/* is reachable without a token
// (server-enforced in app.py), so the app is kept hidden client-side too
// until a valid one is on hand. Two kinds of token exist:
// - the admin's own ADMIN_TOKEN: full read/write
// - a guest token, handed out for the 4-digit PIN shown on the admin's
//   screen: read-only, locked into view mode, valid for 24 hours
// ---------------------------------------------------------------------

function getToken() { return localStorage.getItem('accessToken') || ''; }
function setToken(t) { localStorage.setItem('accessToken', t); }

function authHeaders(extra) {
  const headers = { ...(extra || {}) };
  const token = getToken();
  if (token) headers['X-Access-Token'] = token;
  return headers;
}

function applyRoleToUI(role) {
  state.role = role;
  if (role === 'guest') {
    // Guests only ever see the read-only doctor-facing view; hide anything
    // that lets them switch to (or reach) the editing UI.
    document.body.classList.add('view-mode');
  } else if (role === 'admin') {
    document.body.classList.remove('view-mode');
    document.body.classList.add('is-admin');
    document.getElementById('sharePin').hidden = false;
    startSharePin();
  }
}

function unlockApp(role) {
  applyRoleToUI(role);
  if (role) localStorage.setItem('accessRole', role);
  document.body.classList.remove('auth-locked');
  document.getElementById('authGate').hidden = true;
}

async function tryUnlockWithStoredToken() {
  if (!getToken()) return false;
  try {
    const res = await fetch('/api/auth/check', { headers: authHeaders() });
    if (res.ok) {
      const body = await res.json();
      unlockApp(body.role);
      return true;
    }
    if (res.status === 401) {
      // A stored token the server no longer accepts (most likely an expired
      // guest token): drop it so the gate asks again instead of retrying it.
      localStorage.removeItem('accessToken');
      localStorage.removeItem('accessRole');
    }
  } catch (e) {
    // offline with a previously-verified token: let the app's own
    // offline/cache handling take over rather than blocking on the gate
    unlockApp(state.role);
    return true;
  }
  return false;
}

// One field for both: four digits is the PIN from the admin's screen
// (swapped for a guest token), anything else is tried as a token itself.
let authBusy = false;

async function submitAuth() {
  const input = document.getElementById('authInput');
  const value = input.value.trim();
  if (!value || authBusy) return;
  authBusy = true;
  try {
    let token = value;
    if (/^\d{4}$/.test(value)) {
      const redeem = await fetch('/api/share-pin/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: value }),
      });
      if (redeem.ok) token = (await redeem.json()).token;
    }
    const res = await fetch('/api/auth/check', { headers: { 'X-Access-Token': token } });
    if (!res.ok) throw new Error(res.status);
    const body = await res.json();
    setToken(token);
    unlockApp(body.role);
    startApp();
  } catch (e) {
    // Keep what was typed: a token that happens to start with four digits
    // just carries on being typed.
    if (input.value.trim() === value) input.classList.add('invalid');
  } finally {
    authBusy = false;
  }
}

document.getElementById('authGateForm').addEventListener('submit', (e) => {
  e.preventDefault();
  submitAuth();
});
document.getElementById('authInput').addEventListener('input', (e) => {
  e.target.classList.remove('invalid');
  if (/^\d{4}$/.test(e.target.value.trim())) submitAuth();
});

// ---------------------------------------------------------------------
// Networking + offline cache
// ---------------------------------------------------------------------

async function apiGet(url) {
  const res = await fetch(url, { headers: authHeaders() });
  if (!res.ok) throw new Error(`GET ${url} failed: ${res.status}`);
  return res.json();
}

async function loadEntries() {
  try {
    const entries = await apiGet('/api/memo?limit=3000');
    state.entries = entries;
    state.entriesByDate = {};
    entries.forEach(m => { state.entriesByDate[m.date] = m; });
    localStorage.setItem('cache:entries', JSON.stringify(entries));
    setStatus('オンライン', false);
  } catch (e) {
    console.warn('offline, using cache', e);
    const cached = JSON.parse(localStorage.getItem('cache:entries') || '[]');
    state.entries = cached;
    state.entriesByDate = {};
    cached.forEach(m => { state.entriesByDate[m.date] = m; });
    setStatus('オフライン（キャッシュ表示）', true);
  }
  renderArchive();
}

function setStatus(text, offline) {
  const badge = document.getElementById('statusBadge');
  // Online is the expected state and doesn't need to shout about itself —
  // only surface the badge when there's an actual problem (offline).
  badge.textContent = offline ? text : '';
  badge.classList.toggle('offline', !!offline);
}

function draftKey(dateStr) {
  return `draft:${dateStr}`;
}

function saveDraft(dateStr, data) {
  localStorage.setItem(draftKey(dateStr), JSON.stringify({ ...data, savedAt: Date.now() }));
}

function getDraft(dateStr) {
  const raw = localStorage.getItem(draftKey(dateStr));
  return raw ? JSON.parse(raw) : null;
}

function clearDraft(dateStr) {
  localStorage.removeItem(draftKey(dateStr));
}

async function syncPendingDrafts() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('draft:'));
  for (const key of keys) {
    const dateStr = key.slice('draft:'.length);
    const draft = JSON.parse(localStorage.getItem(key));
    try {
      const res = await fetch('/api/memo', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          date: dateStr,
          summary: draft.summary,
          content: draft.content,
        }),
      });
      if (res.ok) clearDraft(dateStr);
    } catch (e) {
      break; // still offline, stop trying
    }
  }
  loadEntries();
}

window.addEventListener('online', () => { setStatus('オンライン', false); syncPendingDrafts(); });
window.addEventListener('offline', () => setStatus('オフライン', true));

// ---------------------------------------------------------------------
// Older memos: every entry except the one on top, newest first, rendered
// read-only below it on the same page.
// ---------------------------------------------------------------------

function agoLabel(dateStr) {
  const today = new Date(fmtDate(new Date()) + 'T00:00:00');
  const days = Math.round((today - new Date(dateStr + 'T00:00:00')) / 86400000);
  return days === 0 ? '今日' : days > 0 ? `${days}日前` : `${-days}日後`;
}

function renderArchive() {
  const archive = document.getElementById('archive');
  archive.innerHTML = '';

  state.entries
    .filter(m => m.date !== state.selectedDate)
    .forEach(m => {
      const section = document.createElement('section');
      section.className = 'archive-entry';

      const head = document.createElement('div');
      head.className = 'archive-head';

      const dateSpan = document.createElement('span');
      dateSpan.className = 'archive-date';
      dateSpan.textContent = m.date;
      dateSpan.addEventListener('click', () => {
        if (!document.body.classList.contains('view-mode')) selectDate(m.date);
      });
      head.appendChild(dateSpan);

      const wdSpan = document.createElement('span');
      wdSpan.className = 'archive-weekday';
      wdSpan.textContent = `(${weekdayLabel(m.date)})`;
      head.appendChild(wdSpan);

      const agoSpan = document.createElement('span');
      agoSpan.className = 'archive-ago';
      agoSpan.textContent = agoLabel(m.date);
      head.appendChild(agoSpan);

      const delBtn = document.createElement('button');
      delBtn.className = 'entry-delete';
      delBtn.type = 'button';
      delBtn.setAttribute('aria-label', `${m.date} のメモを削除`);
      delBtn.textContent = '🗑';
      delBtn.addEventListener('click', () => deleteEntry(m.date));
      head.appendChild(delBtn);
      section.appendChild(head);

      const body = document.createElement('div');
      body.className = 'memo-body';
      renderMarkdown(body, m.content);
      section.appendChild(body);

      archive.appendChild(section);
    });
}

function selectDate(dateStr) {
  if (dateStr === state.selectedDate) return; // already showing it

  if (autosaveTimer) {
    // Switching the entry on top can happen before the debounce fires —
    // flush whatever was just typed under the old date first so it isn't
    // silently dropped.
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
    autosaveNow();
  }

  state.selectedDate = dateStr;
  document.getElementById('jumpDateInput').value = dateStr;
  renderArchive();
  loadEditorForSelectedDate();
  setCovered(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function loadEditorForSelectedDate() {
  document.getElementById('editorCard').classList.remove('copied-reveal');
  const dateStr = state.selectedDate;
  document.getElementById('selectedDateLabel').textContent = dateStr;
  document.getElementById('selectedDateWeekday').textContent = `(${weekdayLabel(dateStr)})`;
  const memo = state.entriesByDate[dateStr];
  const draft = getDraft(dateStr);

  const base = draft || memo || { content: '' };
  state.currentMemoId = memo ? memo.id : null;

  document.getElementById('contentEdit').value = base.content || '';

  setSaveStatus(draft ? '未同期の下書きがあります' : '', draft ? 'offline' : '');
  updatePreview();
  setCovered(!!(base.content || '').trim());
}

// View mode keeps the memos blurred until the latest one has been copied:
// the cover button copies the text, then lifts the blur.
function setCovered(on) {
  document.getElementById('editorCard').classList.toggle('covered', on);
  document.body.classList.toggle('is-covered', on);
}
document.getElementById('revealBtn').addEventListener('click', () => {
  const text = document.getElementById('contentEdit').value;
  const card = document.getElementById('editorCard');
  const btn = document.getElementById('revealBtn');
  const reveal = () => {
    btn.textContent = 'コピーしました！';
    card.classList.add('revealing', 'copied-reveal');
    document.body.classList.add('is-revealing');
    setTimeout(() => {
      setCovered(false);
      card.classList.remove('revealing');
      document.body.classList.remove('is-revealing');
      btn.textContent = '📋 メモをコピーして表示';
    }, 900);
  };
  // Reveal even if the clipboard is unavailable (insecure context, denied).
  try { navigator.clipboard.writeText(text).then(reveal, reveal); } catch (e) { reveal(); }
});

document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = document.getElementById('jumpDateInput').value;
  if (v) selectDate(v);
});

// ---------------------------------------------------------------------
// Editor
// ---------------------------------------------------------------------

function renderMarkdown(el, content) {
  el.innerHTML = (content || '').trim()
    ? marked.parse(content)
    : '<p style="color:var(--text-faint);">（内容なし）</p>';
  decorateContentImages(el);
}

function updatePreview() {
  renderMarkdown(document.getElementById('contentView'), document.getElementById('contentEdit').value);
}

// Wrap each preview image in a frame that shows a "クリックして拡大" hint
// on hover, so it's clear the (shrunk) thumbnail opens a full-size lightbox.
function decorateContentImages(el) {
  el.querySelectorAll('img').forEach(img => {
    const frame = document.createElement('span');
    frame.className = 'img-frame';
    img.replaceWith(frame);
    frame.appendChild(img);

    const hint = document.createElement('span');
    hint.className = 'img-hint';
    hint.textContent = '🔍 クリックして拡大';
    frame.appendChild(hint);
  });
}

// ---------------------------------------------------------------------
// Image lightbox: click a preview thumbnail to view it full-size, with
// prev/next between the memo's other images (carousel-style) and a
// download button.
// ---------------------------------------------------------------------

const lightboxState = { urls: [], index: 0 };

function filenameFromImageUrl(url) {
  if (url.startsWith('data:')) {
    const m = /^data:image\/(\w+)/.exec(url);
    return `image.${m ? m[1].replace('svg+xml', 'svg') : 'png'}`;
  }
  return (url.split('/').pop() || 'image').split('?')[0].split('#')[0] || 'image';
}

function renderLightbox() {
  const { urls, index } = lightboxState;
  const url = urls[index];
  document.getElementById('lightboxImage').src = url;

  const multi = urls.length > 1;
  document.getElementById('lightboxCounter').textContent = multi ? `${index + 1} / ${urls.length}` : '';
  document.getElementById('lightboxPrevBtn').style.display = multi ? '' : 'none';
  document.getElementById('lightboxNextBtn').style.display = multi ? '' : 'none';

const dl = document.getElementById('lightboxDownload');

dl.href = url;
dl.download = filenameFromImageUrl(url);

dl.onclick = async (e) => {
  e.preventDefault();

  try {
    const response = await fetch(url, {
      mode: 'cors',
      credentials: 'omit',
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filenameFromImageUrl(url);

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  } catch (error) {
    console.error('画像のダウンロードに失敗しました:', error);

    // fetch/CORSで失敗した場合は従来どおり開く
    window.open(url, '_blank', 'noopener');
  }
};
}

function openLightbox(urls, index) {
  lightboxState.urls = urls;
  lightboxState.index = index;
  renderLightbox();
  document.getElementById('imageLightbox').showModal();
}

document.querySelector('.app').addEventListener('click', (e) => {
  const clicked = e.target.closest('#contentView img, .memo-body img');
  if (!clicked) return;
  const imgs = Array.from(clicked.closest('#contentView, .memo-body').querySelectorAll('img'));
  openLightbox(imgs.map(img => img.src), imgs.indexOf(clicked));
});

document.getElementById('lightboxPrevBtn').addEventListener('click', () => {
  lightboxState.index = (lightboxState.index - 1 + lightboxState.urls.length) % lightboxState.urls.length;
  renderLightbox();
});
document.getElementById('lightboxNextBtn').addEventListener('click', () => {
  lightboxState.index = (lightboxState.index + 1) % lightboxState.urls.length;
  renderLightbox();
});
document.getElementById('lightboxCloseBtn').addEventListener('click', () => {
  document.getElementById('imageLightbox').close();
});
document.getElementById('imageLightbox').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') document.getElementById('lightboxPrevBtn').click();
  if (e.key === 'ArrowRight') document.getElementById('lightboxNextBtn').click();
});

function setSaveStatus(text, kind) {
  const el = document.getElementById('saveStatus');
  el.textContent = text;
  el.classList.remove('saved', 'pending', 'offline');
  if (kind) el.classList.add(kind);
}

function currentFormData() {
  const content = document.getElementById('contentEdit').value;
  return {
    summary: firstLine(content), // one-line summary is just the first heading/line, not a separate field
    content,
  };
}

// ---------------------------------------------------------------------
// Autosave (no manual save button: every edit is persisted automatically)
// ---------------------------------------------------------------------

let autosaveTimer = null;

function onFormInput() {
  setSaveStatus('入力中…', 'pending');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveNow, 700);
}

async function autosaveNow() {
  const dateStr = state.selectedDate;
  const payload = currentFormData();

  if (!payload.content && !state.currentMemoId) {
    clearDraft(dateStr);
    setSaveStatus('', '');
    return;
  }

  setSaveStatus('保存中…', 'pending');
  try {
    const res = await fetch('/api/memo', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ date: dateStr, ...payload }),
    });
    if (!res.ok) throw new Error(await res.text());
    const memo = await res.json();
    state.entriesByDate[dateStr] = memo;
    const isNewDate = !state.entries.some(m => m.date === dateStr);
    if (isNewDate) {
      state.entries.unshift(memo);
      state.entries.sort((a, b) => b.date.localeCompare(a.date));
    } else {
      state.entries = state.entries.map(m => m.date === dateStr ? memo : m);
    }
    state.currentMemoId = memo.id;
    clearDraft(dateStr);
    setSaveStatus('保存しました ✓', 'saved');
    renderArchive();
  } catch (e) {
    saveDraft(dateStr, payload);
    setSaveStatus('オフラインのため下書き保存しました', 'offline');
  }
}

document.getElementById('contentEdit').addEventListener('input', onFormInput);
document.getElementById('contentEdit').addEventListener('input', updatePreview);
document.getElementById('contentEdit').addEventListener('keydown', function (e) {
  applyMarkdownEditorKeydown(this, e);
});
document.getElementById('contentEdit').addEventListener('input', fitEditorHeight);
document.getElementById('contentEdit').addEventListener('focus', () => document.body.classList.add('editor-focused'));
document.getElementById('contentEdit').addEventListener('blur', () => {
  document.body.classList.remove('editor-focused');
  document.getElementById('editorCard').classList.remove('editing');
});

function fitEditorHeight() {
  const el = document.getElementById('contentEdit');
  el.style.height = 'auto';
  el.style.height = `${el.scrollHeight + 2}px`;
}

// Tapping anywhere outside the textarea leaves it (iOS doesn't always blur
// on a tap on non-focusable content).
document.addEventListener('pointerdown', (e) => {
  const el = document.getElementById('contentEdit');
  if (document.activeElement === el && e.target !== el) el.blur();
});

// Edit mode: tap the rendered memo to switch to the textarea (images still
// open the lightbox instead).
document.getElementById('contentView').addEventListener('click', (e) => {
  if (document.body.classList.contains('view-mode') || e.target.closest('img, a')) return;
  const el = document.getElementById('contentEdit');
  document.getElementById('editorCard').classList.add('editing');
  fitEditorHeight();
  el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
});

async function deleteEntry(dateStr) {
  if (!confirm(`${dateStr} のメモを削除しますか？`)) return;
  clearDraft(dateStr);
  const memo = state.entriesByDate[dateStr];
  if (memo) {
    try {
      await fetch(`/api/memo/${memo.id}`, { method: 'DELETE', headers: authHeaders() });
    } catch (e) {
      setSaveStatus('オフラインのため削除できませんでした', 'offline');
      return;
    }
    delete state.entriesByDate[dateStr];
    state.entries = state.entries.filter(m => m.date !== dateStr);
  }

  if (state.selectedDate === dateStr) {
    document.getElementById('contentEdit').value = '';
    state.currentMemoId = null;
    setSaveStatus('削除しました', '');
    updatePreview();
  }

  renderArchive();
}

// ---------------------------------------------------------------------
// Mode toggle (edit <-> doctor-facing read-only view, same page/URL)
// ---------------------------------------------------------------------

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    const original = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('done'); }, 1500);
  });
}

document.getElementById('copyBtn').addEventListener('click', function () {
  copyToClipboard(document.getElementById('contentEdit').value, this);
});

function toggleMode() {
  if (state.role !== 'admin') return;
  const viewMode = document.body.classList.toggle('view-mode');
  // View mode puts the latest memo on top; edit mode opens today's.
  const latest = state.entries.length ? state.entries[0].date : fmtDate(new Date());
  state.selectedDate = viewMode ? latest : fmtDate(new Date());
  document.getElementById('jumpDateInput').value = state.selectedDate;
  renderArchive();
  loadEditorForSelectedDate();
  // The admin's own read-only view shows the memo right away; only the
  // doctor's (guest) view gets the copy-to-reveal cover.
  setCovered(false);
}


// ---------------------------------------------------------------------
// Share PIN (admin-only): the current 4-digit PIN, always shown at the top
// right of the edit screen. The server rotates it every few minutes and
// after each use, so it is re-fetched periodically and when it runs out.
// ---------------------------------------------------------------------

let sharePinExpiresAt = 0;

async function refreshSharePin() {
  try {
    const { pin, expires_at } = await apiGet('/api/share-pin');
    document.getElementById('sharePinValue').textContent = pin;
    sharePinExpiresAt = new Date(expires_at).getTime();
  } catch (e) {
    document.getElementById('sharePinValue').textContent = '----';
    sharePinExpiresAt = 0;
  }
  tickSharePin();
}

function tickSharePin() {
  const sec = Math.max(0, Math.round((sharePinExpiresAt - Date.now()) / 1000));
  document.getElementById('sharePinTimer').textContent = sec ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : '';
}

function startSharePin() {
  refreshSharePin();
  let sinceRefresh = 0;
  setInterval(() => {
    tickSharePin();
    sinceRefresh++;
    // Re-check every 15s (picks up a PIN that was just used) and as soon as it expires.
    if (document.hidden) return;
    if (sinceRefresh >= 15 || (sharePinExpiresAt && Date.now() >= sharePinExpiresAt)) {
      sinceRefresh = 0;
      refreshSharePin();
    }
  }, 1000);
}
document.getElementById('viewOnlyBtn').addEventListener('click', toggleMode);
document.getElementById('editBackBtn').addEventListener('click', toggleMode);

// e: switch edit/view mode. Escape leaves the
// textarea so the keys work again.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.activeElement && document.activeElement.id === 'contentEdit') document.activeElement.blur();
    return;
  }
  if (e.key !== 'e') return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || e.isComposing) return;
  if (document.querySelector('dialog[open]') || document.body.classList.contains('auth-locked')) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  e.preventDefault();
  toggleMode();
});

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update())
      .catch(() => {});
  });
  // A newer service worker took over (new deploy): reload once so the
  // latest version of the app is what's on screen, unless mid-typing.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || autosaveTimer) return;
    if (document.activeElement && document.activeElement.id === 'contentEdit') return;
    reloaded = true;
    location.reload();
  });
}

function startApp() {
  document.getElementById('jumpDateInput').value = state.selectedDate;
  setStatus(navigator.onLine ? 'オンライン' : 'オフライン', !navigator.onLine);

  loadEntries().then(() => {
    // Land on the latest entry rather than today's (likely blank) date;
    // the editor opens on the newest memo rather than a blank today.
    if (state.entries.length) {
      state.selectedDate = state.entries[0].date;
      document.getElementById('jumpDateInput').value = state.selectedDate;
    }
    renderArchive();
    loadEditorForSelectedDate();
    if (navigator.onLine) syncPendingDrafts();
  });
}

tryUnlockWithStoredToken().then(unlocked => {
  if (unlocked) {
    startApp();
  } else {
    document.getElementById('authInput').focus();
  }
});
</script>
