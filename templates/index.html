<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>通院メモ</title>
<meta name="theme-color" content="#fffdfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2b2119" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  .app {
    display: grid;
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    padding-bottom: 0;
    align-items: start;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  /* Entry list -------------------------------------------------- */
  .search-row { margin-bottom: 10px; }
  .jump-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .jump-row input[type=date] { flex: 1; }
  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: -2px;
    padding: 2px;
  }
  .entry-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    transition: background var(--t-fast), border-color var(--t-fast);
  }
  .entry-row:hover { background: var(--accent-dim); }
  .entry-row.selected { border-color: var(--accent-soft); background: var(--accent-dim); }
  .entry-main { flex: 1; min-width: 0; cursor: pointer; padding: 8px 4px 8px 10px; }
  .entry-top { display: flex; align-items: baseline; gap: 7px; }
  .entry-date { font-size: 0.85rem; font-weight: 600; }
  .entry-weekday { font-size: 0.72rem; color: var(--text-faint); }
  .entry-today {
    font-size: 0.65rem;
    color: var(--accent);
    background: var(--accent-dim);
    border-radius: 999px;
    padding: 1px 7px;
    font-weight: 600;
  }
  .entry-summary {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .entry-delete {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text-faint);
    font-size: 0.85rem;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--t-fast), background var(--t-fast), color var(--t-fast);
  }
  .entry-row:hover .entry-delete,
  .entry-row:focus-within .entry-delete { opacity: 1; }
  .entry-delete:hover { background: var(--danger-dim); color: var(--danger); }
  .entry-empty { font-size: 0.82rem; color: var(--text-dim); padding: 8px 4px; }

  /* Editor card --------------------------------------------------- */
  .editor-card { display: flex; flex-direction: column; gap: 12px; }
  .editor-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .date-label-group { display: flex; align-items: baseline; gap: 8px; }
  .selected-date-label { font-weight: 700; font-size: 1.1rem; }
  .selected-date-weekday { font-size: 0.85rem; color: var(--text-dim); }
  .copy-btn { display: none; font-size: 0.78rem; padding: 5px 12px; opacity: 0.5; transition: opacity var(--t-fast); animation: pulse 2s infinite; }
  .copy-btn:hover { opacity: 1; animation: none; }
  body:not(.view-mode) .copy-btn { display: inline-block; }
  body.view-mode .copy-btn { display: inline-block; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .editor-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .editor-toolbar .group { display: flex; gap: 6px; flex-wrap: wrap; }
  .editor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) {
    .editor-split { grid-template-columns: 1fr; }
  }
  #contentEdit { width: 100%; min-height: 640px; resize: vertical; line-height: 1.55; }
  #contentView {
    min-height: 640px;
    max-height: 880px;
    overflow-y: auto;
    line-height: 1.65;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    background: var(--bg-elevated);
    transition: background var(--t), border-color var(--t);
  }
  #contentView h2 { font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #contentView :first-child { margin-top: 0; }
  #contentView img {
    display: block;
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: var(--radius-sm);
    cursor: zoom-in;
    transition: opacity var(--t-fast);
  }
  #contentView .img-frame {
    display: inline-block;
    vertical-align: top;
    max-width: 100%;
    margin: 8px 8px 8px 0;
    position: relative;
  }
  #contentView .img-frame:hover img { opacity: 0.85; }
  #contentView .img-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 0.78rem;
    border-radius: var(--radius-sm);
    opacity: 0;
    transition: opacity var(--t-fast);
    pointer-events: none;
  }
  #contentView .img-frame:hover .img-hint { opacity: 1; }
  .status-row { display: flex; justify-content: flex-end; align-items: center; }
  #saveStatus { font-size: 0.78rem; color: var(--text-faint); transition: color var(--t); min-height: 1em; }
  #saveStatus.saved { color: var(--success); }
  #saveStatus.pending { color: var(--text-dim); }
  #saveStatus.offline { color: var(--danger); }


  /* View mode: doctor-facing read-only view of the same page, toggled
     in place instead of navigating to a separate page/URL. */
  body.view-mode .jump-row,
  body.view-mode .entry-delete,
  body.view-mode #historyBtn,
  body.view-mode #templateBtn,
  body.view-mode #combineImagesBtn,
  body.view-mode #saveStatus,
  body.view-mode #contentEdit,
  body.view-mode .import-row .csv-import-label,
  body.view-mode .external-link-row,
  body.view-mode .hint { display: none; }
  body.view-mode .editor-split { grid-template-columns: 1fr; }
  body.view-mode #contentView { max-height: none; }
  body.view-mode .copy-btn { display: inline-block; }

  /* Vitals section ------------------------------------------------ */
  .vitals-section { padding: 16px; max-width: 1600px; margin: 0 auto; }
  .vitals-card { max-width: none; }
  .vitals-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .chart-box { height: 440px; position: relative; }
  #chartsContainer { background: var(--bg-elevated); padding: 8px; border-radius: var(--radius-sm); transition: background var(--t); }
  .external-link-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .external-link-row a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .import-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .import-row label.btn { display: inline-block; }
  .import-row input[type=file] { display: none; }
  #saveChartImageBtn { margin-left: auto; }

  /* Edit history dialog -------------------------------------------- */
  .history-dialog {
    width: min(680px, 92vw);
    max-height: 84vh;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    background: var(--card-bg);
    color: var(--text);
  }
  /* Scoped to [open]: setting display here (rather than on the bare
     .history-dialog selector) keeps the UA's dialog:not([open]) { display:
     none } in effect while closed — an author display rule on the bare
     selector would otherwise win and render the dialog inline on the page. */
  .history-dialog[open] { display: flex; flex-direction: column; }
  .history-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .history-slider-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .history-slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .history-slider-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.8rem; }
  .history-slider-time { font-weight: 600; }
  .history-slider-position { color: var(--text-faint); flex-shrink: 0; }
  .history-preview {
    flex: 1;
    overflow-y: auto;
    min-height: 200px;
    max-height: 50vh;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 0.85rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .history-diff-line { display: block; padding: 1px 4px; border-radius: 4px; }
  .history-diff-line.added { background: var(--success-dim); color: var(--success); }
  .history-diff-line.removed { background: var(--danger-dim); color: var(--danger); text-decoration: line-through; }
  .history-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .history-empty { font-size: 0.82rem; color: var(--text-dim); padding: 8px 4px; }

  /* Image lightbox (click a preview image to view it full-size) ---- */
  .lightbox-dialog {
    box-sizing: border-box;
    width: calc(100vw - 24px);
    height: calc(100vh - 24px);
    height: calc(100dvh - 24px);
    max-width: none;
    max-height: none;
    border: none;
    border-radius: var(--radius);
    padding: 0;
    background: #14161a;
    color: #fff;
  }
  .lightbox-dialog[open] { display: flex; flex-direction: column; }
  .lightbox-dialog::backdrop { background: rgba(0, 0, 0, 0.75); }
  .lightbox-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; }
  .lightbox-toolbar .btn.secondary { color: #fff; border-color: rgba(255, 255, 255, 0.5); }
  .lightbox-toolbar .btn.secondary:hover { background: rgba(255, 255, 255, 0.15); }
  .lightbox-counter { font-size: 0.8rem; color: rgba(255, 255, 255, 0.75); }
  .lightbox-body { position: relative; display: flex; flex: 1; align-items: center; justify-content: center; min-height: 0; }
  .lightbox-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    border: none;
    font-size: 1.6rem;
    line-height: 1;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lightbox-nav:hover { background: rgba(0, 0, 0, 0.65); }
  .lightbox-prev { left: 8px; }
  .lightbox-next { right: 8px; }

  /* Access-token gate: covers the whole app until a valid token is supplied,
     so memo content never renders (and its API calls never fire) for
     anyone without the token. */
  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .auth-gate[hidden] { display: none; }
  .auth-gate-card { width: min(360px, 90vw); display: flex; flex-direction: column; gap: 12px; }
  .auth-gate-card h2 { margin: 0; font-size: 1.05rem; }
  .auth-gate-card input[type=password] { width: 100%; }
  .auth-gate-error { font-size: 0.8rem; color: var(--danger); min-height: 1em; }
  body.auth-locked .app,
  body.auth-locked .vitals-section { display: none; }

  /* Guest links dialog (admin-only: issue/list/revoke time-limited read-only URLs) */
  #guestLinksBtn { display: none; } /* shown only once auth-check reports role=admin */
  .guest-links-dialog {
    width: min(560px, 92vw);
    max-height: 84vh;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    background: var(--card-bg);
    color: var(--text);
  }
  .guest-links-dialog[open] { display: flex; flex-direction: column; gap: 14px; }
  .guest-links-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  .guest-links-head { display: flex; justify-content: space-between; align-items: center; }
  .guest-links-issue-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .guest-links-issue-row select { flex: 0 0 auto; }
  .guest-link-result { display: none; flex-direction: column; gap: 6px; }
  .guest-link-result.visible { display: flex; }
  .guest-link-result input[type=text] { width: 100%; }
  .guest-links-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .guest-link-row { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft); }
  .guest-link-row.inactive { opacity: 0.55; }
  .guest-link-token { font-family: monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .guest-link-expiry { flex-shrink: 0; color: var(--text-dim); }
  .guest-link-empty { font-size: 0.82rem; color: var(--text-dim); padding: 8px 4px; }
</style>
</head>
<body class="view-mode auth-locked">
<div class="auth-gate" id="authGate">
  <form class="card auth-gate-card" id="authGateForm">
    <h2>🔒 アクセストークンが必要です</h2>
    <input type="password" id="authTokenInput" placeholder="トークンを入力" autocomplete="current-password">
    <button type="submit" class="btn">開く</button>
    <div class="auth-gate-error" id="authGateError"></div>
  </form>
</div>
<header>
  <h1>📋 通院メモ</h1>
  <div class="header-right">
    <button type="button" class="nav-link ui-fade" id="guestLinksBtn">🔗 一時URL発行</button>
    <button type="button" class="nav-link ui-fade" id="modeToggleBtn">✏️ 編集モードに切替</button>
    <span id="statusBadge" class="ui-fade"></span>
  </div>
</header>

<div class="vitals-section">
  <div class="card vitals-card">
    <div class="vitals-toolbar">
      <h2 style="margin:0;">📊 バイタル（睡眠・歩数）</h2>
      <div class="period-toggle ui-fade">
        <button class="btn secondary" data-mode="recent">直近50日</button>
        <button class="btn secondary" data-mode="recent100">直近100日</button>
        <button class="btn secondary" data-mode="recent200">直近200日</button>
        <button class="btn secondary" data-mode="recent300">直近300日</button>
        <button class="btn secondary" data-mode="week">週次</button>
        <button class="btn secondary" data-mode="month">月次</button>
      </div>
    </div>
    <div id="chartsContainer">
      <div class="chart-box"><canvas id="vitalsChart"></canvas></div>
    </div>
    <div class="external-link-row">
      <a class="btn secondary" href="https://dashboard.exercise.quest/history" target="_blank" rel="noopener">📈 Exercise Dashboard の履歴を開く</a>
      <a class="btn secondary" href="https://hanazonomental.com/" target="_blank" rel="noopener">🏥 病院のホームページ</a>
    </div>
    <div class="import-row">
      <label class="btn secondary csv-import-label">睡眠CSVインポート<input type="file" id="sleepCsvInput" accept=".csv"></label>
      <label class="btn secondary csv-import-label">歩数CSVインポート<input type="file" id="stepsCsvInput" accept=".csv"></label>
      <button class="btn secondary" id="saveChartImageBtn">🖼 グラフを画像保存</button>
    </div>
    <div class="hint">CSVは date/day/timestamp 列 と overall_score(睡眠スコア)/steps 列を自動検出します。</div>
  </div>
</div>

<div class="app">
  <div class="left fade-on-editor-focus">
    <div class="card">
      <div class="search-row">
        <input type="search" id="searchInput" list="searchHistoryList" placeholder="🔍">
        <datalist id="searchHistoryList"></datalist>
      </div>
      <div class="jump-row">
        <input type="date" id="jumpDateInput">
        <button class="btn" id="jumpBtn">開く/新規</button>
      </div>
      <div class="entry-list" id="entryList"></div>
    </div>
  </div>

  <div class="card editor-card" id="editorCard">
    <div class="editor-head">
      <div class="date-label-group">
        <span class="selected-date-label" id="selectedDateLabel"></span>
        <span class="selected-date-weekday" id="selectedDateWeekday"></span>
      </div>
      <button class="btn secondary copy-btn" id="copyBtn">メモをコピー</button>
    </div>

    <div class="editor-toolbar">
      <div class="group">
        <button class="btn secondary" id="historyBtn">🕘 編集履歴</button>
        <button class="btn secondary" id="templateBtn">4セクション挿入</button>
        <button class="btn secondary" id="combineImagesBtn">🖼 画像を結合保存</button>
      </div>
    </div>
    <div class="editor-split">
      <textarea id="contentEdit" placeholder="## 生活変化&#10;&#10;## 体調&#10;&#10;## 今後の意向&#10;&#10;## 質問・相談・依頼"></textarea>
      <div id="contentView"></div>
    </div>
    <div class="status-row">
      <span id="saveStatus"></span>
    </div>
  </div>
</div>

<dialog id="historyDialog" class="history-dialog">
  <div class="history-head">
    <h2 style="margin:0;">🕘 編集履歴</h2>
    <button type="button" class="btn secondary" id="historyCloseBtn">閉じる</button>
  </div>
  <div id="historyBody">
    <div class="history-slider-row">
      <input type="range" id="historySlider" min="0" max="0" value="0" step="1">
      <div class="history-slider-label">
        <span class="history-slider-time" id="historySliderTime"></span>
        <span class="history-slider-position" id="historySliderPosition"></span>
      </div>
    </div>
    <div id="historyPreview" class="history-preview"></div>
    <div class="history-actions">
      <button type="button" class="btn secondary" id="historyRestoreBtn">この内容を復元</button>
    </div>
  </div>
</dialog>

<dialog id="imageLightbox" class="lightbox-dialog">
  <div class="lightbox-toolbar">
    <span class="lightbox-counter" id="lightboxCounter"></span>
    <div style="display:flex; gap:6px;">
      <a class="btn secondary" id="lightboxDownload" download>⬇ ダウンロード</a>
      <button type="button" class="btn secondary" id="lightboxCloseBtn">閉じる</button>
    </div>
  </div>
  <div class="lightbox-body">
    <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrevBtn" aria-label="前の画像">‹</button>
    <img id="lightboxImage" alt="">
    <button type="button" class="lightbox-nav lightbox-next" id="lightboxNextBtn" aria-label="次の画像">›</button>
  </div>
</dialog>

<dialog id="guestLinksDialog" class="guest-links-dialog">
  <div class="guest-links-head">
    <h2 style="margin:0;">🔗 一時URL（ゲスト閲覧用）</h2>
    <button type="button" class="btn secondary" id="guestLinksCloseBtn">閉じる</button>
  </div>
  <div class="guest-links-issue-row">
    <select id="guestLinkHours">
      <option value="1">1時間</option>
      <option value="24" selected>24時間</option>
      <option value="72">3日</option>
      <option value="168">7日</option>
      <option value="720">30日</option>
    </select>
    <button type="button" class="btn" id="guestLinkCreateBtn">発行</button>
  </div>
  <div class="guest-link-result" id="guestLinkResult">
    <input type="text" id="guestLinkResultUrl" readonly>
    <button type="button" class="btn secondary" id="guestLinkCopyBtn">URLをコピー</button>
  </div>
  <div class="guest-links-list" id="guestLinksList"></div>
</dialog>

<footer>通院メモ &middot; データは Neon PostgreSQL に保存されます</footer>

<script src="{{ url_for('static', filename='idle-ui.js') }}"></script>
<script src="{{ url_for('static', filename='vitals-chart.js') }}"></script>
<script src="{{ url_for('static', filename='markdown-editor.js') }}"></script>
<script>
const TEMPLATE = `## 生活変化

## 体調

## 今後の意向

## 質問・相談・依頼
`;

const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

const state = {
  selectedDate: VitalsChart.fmtDate(new Date()),
  entries: [],
  entriesByDate: {},
  vitals: { sleep: [], steps: [] },
  vitalsMode: 'recent',
  currentMemoId: null,
  searchQuery: '',
  role: null, // 'admin' | 'guest', set once the access token is verified
};

let vitalsChart;

function fmtDate(d) { return VitalsChart.fmtDate(d); }
function addDays(dateStr, n) { return VitalsChart.addDays(dateStr, n); }

function weekdayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAY_JA[d.getDay()];
}

function firstLine(content) {
  if (!content) return '';
  const line = (content.split('\n').find(l => l.trim()) || '');
  return line.replace(/^#+\s*/, '').replace(/^-\s*/, '').trim();
}

// ---------------------------------------------------------------------
// Access-token gate: nothing under /api/* is reachable without a token
// (server-enforced in app.py), so the app is kept hidden client-side too
// until a valid one is on hand. Two kinds of token exist:
// - the admin's own ADMIN_TOKEN: full read/write, can issue guest links
// - a guest link's token (from a ?guest=... URL an admin shared): read-only,
//   locked into view mode, until the link expires or is revoked
// ---------------------------------------------------------------------

function getToken() { return localStorage.getItem('accessToken') || ''; }
function setToken(t) { localStorage.setItem('accessToken', t); }

function authHeaders(extra) {
  const headers = { ...(extra || {}) };
  const token = getToken();
  if (token) headers['X-Access-Token'] = token;
  return headers;
}

function applyRoleToUI(role) {
  state.role = role;
  if (role === 'guest') {
    // Guests only ever see the read-only doctor-facing view; hide anything
    // that lets them switch to (or reach) the editing UI.
    document.body.classList.add('view-mode');
    document.getElementById('modeToggleBtn').style.display = 'none';
    document.getElementById('guestLinksBtn').style.display = 'none';
  } else if (role === 'admin') {
    document.getElementById('modeToggleBtn').style.display = '';
    document.getElementById('guestLinksBtn').style.display = 'inline-block';
  }
}

function unlockApp(role) {
  applyRoleToUI(role);
  document.body.classList.remove('auth-locked');
  document.getElementById('authGate').hidden = true;
}

// A guest opens a URL like https://.../?guest=<token>; adopt that token as
// this device's stored access token (once) and scrub it from the address
// bar so it doesn't linger in history/screenshots.
function consumeGuestUrlToken() {
  const url = new URL(window.location.href);
  const guestToken = url.searchParams.get('guest');
  if (!guestToken) return null;
  url.searchParams.delete('guest');
  window.history.replaceState({}, '', url.pathname + url.search + url.hash);
  return guestToken;
}

async function tryUnlockWithStoredToken() {
  const guestToken = consumeGuestUrlToken();
  if (guestToken) setToken(guestToken);

  if (!getToken()) return false;
  try {
    const res = await fetch('/api/auth/check', { headers: authHeaders() });
    if (res.ok) {
      const body = await res.json();
      unlockApp(body.role);
      return true;
    }
    if (res.status === 401) {
      // A stored (or ?guest=... supplied) token that the server no longer
      // accepts - most likely a revoked/expired guest link. Drop it instead
      // of getting stuck retrying it silently on every load.
      localStorage.removeItem('accessToken');
      if (guestToken) {
        document.getElementById('authGateError').textContent = 'この一時URLは期限切れか無効になっています。';
      }
    }
  } catch (e) {
    // offline with a previously-verified token: let the app's own
    // offline/cache handling take over rather than blocking on the gate
    unlockApp(state.role);
    return true;
  }
  return false;
}

document.getElementById('authGateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('authTokenInput');
  const errorEl = document.getElementById('authGateError');
  const token = input.value.trim();
  if (!token) return;

  errorEl.textContent = '';
  try {
    const res = await fetch('/api/auth/check', { headers: { 'X-Access-Token': token } });
    if (!res.ok) {
      errorEl.textContent = res.status === 401 ? 'トークンが正しくありません' : `サーバーエラー (${res.status})`;
      return;
    }
    const body = await res.json();
    setToken(token);
    unlockApp(body.role);
    startApp();
  } catch (e) {
    errorEl.textContent = '通信に失敗しました';
  }
});

function formatGuestLinkTime(iso) {

async function loadGuestLinks() {
  const listEl = document.getElementById('guestLinksList');
  listEl.innerHTML = '<div class="guest-link-empty">読み込み中…</div>';
  let links;
  try {
    links = await apiGet('/api/guest-links');
  } catch (e) {
    listEl.innerHTML = '<div class="guest-link-empty">一覧の取得に失敗しました。</div>';
    return;
  }

  if (!links.length) {
    listEl.innerHTML = '<div class="guest-link-empty">発行済みの一時URLはありません。</div>';
    return;
  }

  listEl.innerHTML = '';
  links.forEach(link => {
    const inactive = link.revoked || link.expired;
    const row = document.createElement('div');
    row.className = 'guest-link-row' + (inactive ? ' inactive' : '');

    const tokenSpan = document.createElement('span');
    tokenSpan.className = 'guest-link-token';
    tokenSpan.textContent = `…${link.token.slice(-8)}`;
    row.appendChild(tokenSpan);

    const expirySpan = document.createElement('span');
    expirySpan.className = 'guest-link-expiry';
    expirySpan.textContent = link.revoked
      ? '失効済み'
      : link.expired
      ? '期限切れ'
      : `〜${formatGuestLinkTime(link.expires_at)}`;
    row.appendChild(expirySpan);

    if (!inactive) {
      const revokeBtn = document.createElement('button');
      revokeBtn.type = 'button';
      revokeBtn.className = 'btn secondary';
      revokeBtn.textContent = '失効';
      revokeBtn.addEventListener('click', async () => {
        revokeBtn.disabled = true;
        try {
          await fetch(`/api/guest-links/${link.id}`, { method: 'DELETE', headers: authHeaders() });
        } catch (e) { /* ignore, list refresh below will reflect actual state */ }
        loadGuestLinks();
      });
      row.appendChild(revokeBtn);
    }

    listEl.appendChild(row);
  });
}

async function apiGet(url) {
  const res = await fetch(url, { headers: authHeaders() });
  if (!res.ok) throw new Error(`GET ${url} failed: ${res.status}`);
  return res.json();
}

async function loadEntries() {
  try {
    const entries = await apiGet('/api/memo?limit=3000');
    state.entries = entries;
    state.entriesByDate = {};
    entries.forEach(m => { state.entriesByDate[m.date] = m; });
    localStorage.setItem('cache:entries', JSON.stringify(entries));
    setStatus('オンライン', false);
  } catch (e) {
    console.warn('offline, using cache', e);
    const cached = JSON.parse(localStorage.getItem('cache:entries') || '[]');
    state.entries = cached;
    state.entriesByDate = {};
    cached.forEach(m => { state.entriesByDate[m.date] = m; });
    setStatus('オフライン（キャッシュ表示）', true);
  }
  renderEntryList();
  // loadVitals() runs concurrently and may resolve first — re-render so the
  // clinic-day highlight isn't stuck reflecting an empty entry list.
  renderCharts();
}

function setStatus(text, offline) {
  const badge = document.getElementById('statusBadge');
  // Online is the expected state and doesn't need to shout about itself —
  // only surface the badge when there's an actual problem (offline).
  badge.textContent = offline ? text : '';
  badge.classList.toggle('offline', !!offline);
}

function draftKey(dateStr) {
  return `draft:${dateStr}`;
}

function saveDraft(dateStr, data) {
  localStorage.setItem(draftKey(dateStr), JSON.stringify({ ...data, savedAt: Date.now() }));
}

function getDraft(dateStr) {
  const raw = localStorage.getItem(draftKey(dateStr));
  return raw ? JSON.parse(raw) : null;
}

function clearDraft(dateStr) {
  localStorage.removeItem(draftKey(dateStr));
}

async function syncPendingDrafts() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('draft:'));
  for (const key of keys) {
    const dateStr = key.slice('draft:'.length);
    const draft = JSON.parse(localStorage.getItem(key));
    try {
      const res = await fetch('/api/memo', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          date: dateStr,
          summary: draft.summary,
          content: draft.content,
        }),
      });
      if (res.ok) clearDraft(dateStr);
    } catch (e) {
      break; // still offline, stop trying
    }
  }
  loadEntries();
}

window.addEventListener('online', () => { setStatus('オンライン', false); syncPendingDrafts(); });
window.addEventListener('offline', () => setStatus('オフライン', true));

function renderEntryList() {

  }

// Image lightbox: click a preview thumbnail to view it full-size, with
// prev/next between the memo's other images (carousel-style) and a
// download button.
// ---------------------------------------------------------------------

const lightboxState = { urls: [], index: 0 };

function filenameFromImageUrl(url) {
  if (url.startsWith('data:')) {
    const m = /^data:image\/(\w+)/.exec(url);
    return `image.${m ? m[1].replace('svg+xml', 'svg') : 'png'}`;
  }
  return (url.split('/').pop() || 'image').split('?')[0].split('#')[0] || 'image';
}

function renderLightbox() {
  const { urls, index } = lightboxState;
  const url = urls[index];
  document.getElementById('lightboxImage').src = url;

  const multi = urls.length > 1;
  document.getElementById('lightboxCounter').textContent = multi ? `${index + 1} / ${urls.length}` : '';
  document.getElementById('lightboxPrevBtn').style.display = multi ? '' : 'none';
  document.getElementById('lightboxNextBtn').style.display = multi ? '' : 'none';

const dl = document.getElementById('lightboxDownload');

dl.href = url;
dl.download = filenameFromImageUrl(url);

dl.onclick = async (e) => {
  e.preventDefault();

  try {
    const response = await fetch(url, {
      mode: 'cors',
      credentials: 'omit',
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filenameFromImageUrl(url);

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  } catch (error) {
    console.error('画像のダウンロードに失敗しました:', error);

    // fetch/CORSで失敗した場合は従来どおり開く
    window.open(url, '_blank', 'noopener');
  }
};
}

  lightboxState.urls = urls;
  lightboxState.index = index;
  renderLightbox();
  document.getElementById('imageLightbox').showModal();
}

let autosaveTimer = null;

function onFormInput() {

async function autosaveNow() {
  const dateStr = state.selectedDate;
  const payload = currentFormData();

  if (!payload.content && !state.currentMemoId) {
    clearDraft(dateStr);
    setSaveStatus('', '');
    return;
  }

  setSaveStatus('保存中…', 'pending');
  try {
    const res = await fetch('/api/memo', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ date: dateStr, ...payload }),
    });
    if (!res.ok) throw new Error(await res.text());
    const memo = await res.json();
    state.entriesByDate[dateStr] = memo;
    if (!state.entries.some(m => m.date === dateStr)) {
      state.entries.unshift(memo);
      state.entries.sort((a, b) => b.date.localeCompare(a.date));
    } else {
      state.entries = state.entries.map(m => m.date === dateStr ? memo : m);
    }
    state.currentMemoId = memo.id;
    clearDraft(dateStr);
    setSaveStatus('保存しました ✓', 'saved');
    renderEntryList();
    renderCharts();
  } catch (e) {
    saveDraft(dateStr, payload);
    setSaveStatus('オフラインのため下書き保存しました', 'offline');
  }
}

async function deleteEntry(dateStr) {
  if (!confirm(`${dateStr} のメモを削除しますか？`)) return;
  clearDraft(dateStr);
  const memo = state.entriesByDate[dateStr];
  if (memo) {
    try {
      await fetch(`/api/memo/${memo.id}`, { method: 'DELETE', headers: authHeaders() });

      setSaveStatus('オフラインのため削除できませんでした', 'offline');

    delete state.entriesByDate[dateStr];

  renderCharts();
}

function formatHistoryTime(iso) {
  const d = new Date(iso);
  const dateStr = fmtDate(d);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${dateStr} ${hh}:${mm}`;
}

// Line-based diff (LCS) so the preview can show what was added/removed
// versus the previous checkpoint, not just the raw text.
function diffLines(oldText, newText) {
  const oldLines = (oldText || '').split('\n');
  const newLines = (newText || '').split('\n');
  const n = oldLines.length, m = newLines.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = oldLines[i] === newLines[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const result = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (oldLines[i] === newLines[j]) {
      result.push({ type: 'same', text: oldLines[i] });
      i++; j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) {
      result.push({ type: 'removed', text: oldLines[i] });
      i++;
    } else {
      result.push({ type: 'added', text: newLines[j] });
      j++;
    }
  }
  while (i < n) { result.push({ type: 'removed', text: oldLines[i] }); i++; }
  while (j < m) { result.push({ type: 'added', text: newLines[j] }); j++; }
  return result;
}

let historyVersions = []; // oldest -> newest

function showHistoryMessage(msg) {
  document.getElementById('historySlider').closest('.history-slider-row').style.display = 'none';
  document.getElementById('historyRestoreBtn').closest('.history-actions').style.display = 'none';

function renderHistorySlider() {
  const index = Number(document.getElementById('historySlider').value);
  const version = historyVersions[index];
  const prevContent = index > 0 ? historyVersions[index - 1].content : '';

  document.getElementById('historySliderTime').textContent = formatHistoryTime(version.archived_at);
  document.getElementById('historySliderPosition').textContent = `${index + 1} / ${historyVersions.length}`;

  const previewEl = document.getElementById('historyPreview');
  previewEl.innerHTML = '';
  const diff = diffLines(prevContent, version.content || '');
  diff.forEach(line => {
    const el = document.createElement('span');
    el.className = `history-diff-line ${line.type}`;
    el.textContent = line.text || ' ';
    previewEl.appendChild(el);
  });
}

async function openHistoryDialog() {
  const dialog = document.getElementById('historyDialog');
  const slider = document.getElementById('historySlider');
  document.getElementById('historySlider').closest('.history-slider-row').style.display = '';
  document.getElementById('historyRestoreBtn').closest('.history-actions').style.display = '';
  document.getElementById('historyPreview').innerHTML = '<div class="history-empty">読み込み中…</div>';
  dialog.showModal();

  if (!state.currentMemoId) {
    showHistoryMessage('このエントリはまだ保存されていません。');
    return;
  }

  let versions;
  try {
    versions = await apiGet(`/api/memo/${state.currentMemoId}/history`);
  } catch (e) {
    showHistoryMessage('履歴の取得に失敗しました。');
    return;
  }

  if (!versions.length) {
    showHistoryMessage('まだ履歴はありません（十分な間隔を空けて上書きすると記録されます）。');
    return;
  }

  historyVersions = versions.slice().reverse(); // oldest -> newest
  slider.min = 0;
  slider.max = historyVersions.length - 1;
  slider.value = historyVersions.length - 1; // default to the most recent checkpoint
  renderHistorySlider();
}

document.getElementById('historySlider').addEventListener('input', renderHistorySlider);
document.getElementById('historyRestoreBtn').addEventListener('click', () => {
  const version = historyVersions[Number(document.getElementById('historySlider').value)];
  if (!version) return;
  if (!confirm('現在の内容をこの履歴で置き換えますか？（置き換え後に保存されます）')) return;
  const el = document.getElementById('contentEdit');
  el.value = version.content || '';
  onFormInput();
  updatePreview();
  document.getElementById('historyDialog').close();
});

document.getElementById('historyBtn').addEventListener('click', openHistoryDialog);
document.getElementById('historyCloseBtn').addEventListener('click', () => {
  document.getElementById('historyDialog').close();
});

// ---------------------------------------------------------------------
// Combine markdown-embedded images into one vertical PNG
// ---------------------------------------------------------------------

function extractImageUrls(markdown) {
  const urls = [];
  const re = /!\[[^\]]*\]\(\s*(\S+?)(?:\s+"[^"]*")?\s*\)/g;
  let match;
  while ((match = re.exec(markdown))) urls.push(match[1]);
  return urls;
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(url));
    img.src = url;
  });
}

document.getElementById('combineImagesBtn').addEventListener('click', async () => {
  const urls = extractImageUrls(document.getElementById('contentEdit').value);
  if (!urls.length) {
    alert('本文に画像（![alt](URL) 形式）が見つかりませんでした。');
    return;
  }

  let images;
  try {
    images = await Promise.all(urls.map(loadImage));
  } catch (e) {
    alert('画像の読み込みに失敗しました: ' + e.message);
    return;
  }

  const width = Math.max(...images.map(img => img.naturalWidth));
  let y = 0;
  const placed = images.map(img => {
    const scale = width / img.naturalWidth;
    const h = img.naturalHeight * scale;
    const top = y;
    y += h;
    return { img, h, top };
  });

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = Math.max(1, Math.round(y));
  const ctx = canvas.getContext('2d');
  placed.forEach(({ img, h, top }) => ctx.drawImage(img, 0, top, width, h));

  let dataUrl;
  try {
    dataUrl = canvas.toDataURL('image/png');
  } catch (e) {
    alert('画像の結合に失敗しました（外部画像のセキュリティ制限の可能性があります）: ' + e.message);
    return;
  }

  const link = document.createElement('a');
  link.download = `memo_images_${state.selectedDate}.png`;
  link.href = dataUrl;
  link.click();
});

// ---------------------------------------------------------------------
// Charts
// ---------------------------------------------------------------------

function renderCharts() {
  // Guarded so that a charting failure (e.g. Chart.js CDN hiccup) can't
  // break the callers that also load entries/the editor in the same flow.
  try {
    vitalsChart = VitalsChart.renderVitalsChart(
      document.getElementById('vitalsChart'),
      vitalsChart,
      state.entries,
      state.vitals,
      state.vitalsMode,
      memo => selectDate(memo.date) // hovering a clinic day loads it into the editor
    );
  } catch (e) {
    console.warn('renderCharts failed', e);
  }
}

async function loadVitals() {
  const { start, end } = VitalsChart.vitalsRangeForMode(state.vitalsMode);
  const cacheK = `cache:vitals:${state.vitalsMode}`;
  try {
    const vitals = await apiGet(`/api/vitals?start=${start}&end=${end}`);
    state.vitals = vitals;
    localStorage.setItem(cacheK, JSON.stringify(vitals));
  } catch (e) {
    state.vitals = JSON.parse(localStorage.getItem(cacheK) || '{"sleep":[],"steps":[]}');
  }
  renderCharts();
}

document.querySelectorAll('.period-toggle [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.vitalsMode = btn.dataset.mode;
    document.querySelectorAll('.period-toggle [data-mode]').forEach(b => b.classList.toggle('active', b === btn));
    loadVitals();
  });
});

document.getElementById('saveChartImageBtn').addEventListener('click', () => {
  html2canvas(document.getElementById('chartsContainer')).then(canvas => {
    const link = document.createElement('a');
    link.download = `vitals_${state.vitalsMode}_${fmtDate(new Date())}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

// ---------------------------------------------------------------------
// CSV import
// ---------------------------------------------------------------------

async function importCsv(inputEl, type) {
  const file = inputEl.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  form.append('type', type);
  try {
    const res = await fetch('/api/vitals/import-csv', { method: 'POST', headers: authHeaders(), body: form });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'import failed');
    alert(`${result.imported}件インポートしました（既存の日付は上書き。形式エラーで${result.skipped}件スキップ）`);
    loadVitals();
  } catch (e) {
    alert('インポートに失敗しました: ' + e.message);
  }
  inputEl.value = '';
}

document.getElementById('sleepCsvInput').addEventListener('change', e => importCsv(e.target, 'sleep'));
document.getElementById('stepsCsvInput').addEventListener('change', e => importCsv(e.target, 'steps'));

// ---------------------------------------------------------------------
// Mode toggle (edit <-> doctor-facing read-only view, same page/URL)
// ---------------------------------------------------------------------

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    const original = btn.textContent;
    btn.textContent = 'コピーしました ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

document.getElementById('copyBtn').addEventListener('click', function () {
  copyToClipboard(document.getElementById('contentEdit').value, this);
});

const modeToggleBtn = document.getElementById('modeToggleBtn');
modeToggleBtn.addEventListener('click', () => {
  const viewMode = document.body.classList.toggle('view-mode');
  modeToggleBtn.textContent = viewMode ? '✏️ 編集モードに切替' : '🩺 閲覧モードに切替';
  if (!viewMode) {
    document.getElementById('jumpDateInput').value = VitalsChart.fmtDate(new Date());
    state.selectedDate = document.getElementById('jumpDateInput').value;
    loadEditorForSelectedDate();
  }
});

// Init
// ---------------------------------------------------------------------

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

function startApp() {
  document.querySelector('.period-toggle [data-mode="recent"]').classList.add('active');
  document.getElementById('jumpDateInput').value = state.selectedDate;
  setStatus(navigator.onLine ? 'オンライン' : 'オフライン', !navigator.onLine);

  loadEntries().then(() => {
    // Land on the latest entry rather than today's (likely blank) date, since
    // the page always opens in view mode first.
    if (state.entries.length) {
      state.selectedDate = state.entries[0].date;
      document.getElementById('jumpDateInput').value = state.selectedDate;
    }
    renderEntryList();
    loadEditorForSelectedDate();
    if (navigator.onLine) syncPendingDrafts();
  });
  loadVitals();
  loadSearchHistory();
}

tryUnlockWithStoredToken().then(unlocked => {
  if (unlocked) {
    startApp();
  } else {
    document.getElementById('authTokenInput').focus();
  }
});
