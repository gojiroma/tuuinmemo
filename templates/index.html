<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>通院メモ</title>
<meta name="theme-color" content="#3a6ea5">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #dde2e7;
    --text: #22282f;
    --text-dim: #6b7684;
    --accent: #3a6ea5;
    --accent-dim: #e7eef6;
    --clinic: #e0793a;
    --clinic-bg: #fdece0;
    --danger: #c0392b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  header .header-right { display: flex; align-items: center; gap: 10px; }
  header a.view-link {
    color: #fff;
    font-size: 0.8rem;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 999px;
    padding: 4px 12px;
  }
  header a.view-link:hover { background: rgba(255,255,255,0.15); }
  #statusBadge {
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.2);
  }
  #statusBadge.offline { background: #c0392b; }
  .app {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 14px;
    padding: 14px;
    padding-bottom: 0;
    align-items: start;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }
  .left { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .card h2 {
    font-size: 0.95rem;
    margin: 0 0 10px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .jump-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .jump-row input[type=date] { flex: 1; }
  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 420px;
    overflow-y: auto;
  }
  .entry-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .entry-row:hover { background: var(--accent-dim); }
  .entry-row.selected { border-color: var(--accent); background: var(--accent-dim); }
  .entry-row .entry-top { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; }
  .entry-row .entry-summary { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge-clinic {
    font-size: 0.68rem;
    background: var(--clinic-bg);
    color: var(--clinic);
    border-radius: 999px;
    padding: 1px 8px;
    font-weight: 600;
  }
  .entry-empty { font-size: 0.82rem; color: var(--text-dim); padding: 8px 4px; }
  .field-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .field-row label { font-size: 0.85rem; color: var(--text-dim); }
  input[type=text], textarea, input[type=date] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  .selected-date-label { font-weight: 600; font-size: 1rem; margin-bottom: 6px; }
  button.btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button.btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button.btn.danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  button.btn.active { background: var(--accent); color: #fff; }
  button.btn:disabled { opacity: 0.5; cursor: default; }
  .editor-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .editor-toolbar .group { display: flex; gap: 6px; }
  #contentEdit { width: 100%; min-height: 380px; resize: vertical; line-height: 1.5; }
  #contentView { min-height: 380px; line-height: 1.6; }
  #contentView h2 { font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #contentView :first-child { margin-top: 0; }
  .save-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  #saveStatus { font-size: 0.78rem; color: var(--text-dim); }

  .vitals-section { padding: 14px; }
  .vitals-card { max-width: none; }
  .vitals-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .period-toggle { display: flex; gap: 6px; }
  .charts-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .charts-row > div { flex: 1 1 420px; min-width: 0; }
  .chart-box { height: 380px; position: relative; }
  #chartsContainer { background: #fff; padding: 8px; border-radius: 8px; }
  .import-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .import-row label.btn { display: inline-block; }
  .import-row input[type=file] { display: none; }
  .hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 6px; }
  footer { text-align: center; font-size: 0.7rem; color: var(--text-dim); padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>📋 通院メモ</h1>
  <div class="header-right">
    <a class="view-link" href="/view" target="_blank" rel="noopener">🩺 医師用ページを開く</a>
    <span id="statusBadge">オンライン</span>
  </div>
</header>

<div class="app">
  <div class="left">
    <div class="card">
      <h2>エントリ一覧</h2>
      <div class="jump-row">
        <input type="date" id="jumpDateInput">
        <button class="btn" id="jumpBtn">開く/新規</button>
      </div>
      <div class="entry-list" id="entryList"></div>

      <div class="selected-date-label" id="selectedDateLabel" style="margin-top:14px;"></div>
      <div class="field-row">
        <input type="checkbox" id="clinicDayCheck">
        <label for="clinicDayCheck">この日は通院日</label>
      </div>
      <div class="field-row" style="flex-direction:column; align-items:stretch;">
        <label for="summaryInput" style="margin-bottom:4px;">サマリ（短い要約）</label>
        <input type="text" id="summaryInput" placeholder="今日のひとこと要約">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="editor-toolbar">
      <h2 style="margin:0;">📝 Markdown メモ</h2>
      <div class="group">
        <button class="btn secondary" id="templateBtn">4セクション挿入</button>
        <button class="btn secondary" id="toggleModeBtn">プレビュー</button>
      </div>
    </div>
    <textarea id="contentEdit" placeholder="## 生活変化&#10;&#10;## 体調&#10;&#10;## 今後の意向&#10;&#10;## 質問・相談・依頼"></textarea>
    <div id="contentView" style="display:none;"></div>
    <div class="save-row">
      <span id="saveStatus"></span>
      <div class="group">
        <button class="btn danger" id="deleteBtn">削除</button>
        <button class="btn" id="saveBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="vitals-section">
  <div class="card vitals-card">
    <div class="vitals-toolbar">
      <h2 style="margin:0;">📊 バイタル（睡眠・歩数）</h2>
      <div class="period-toggle">
        <button class="btn secondary" data-mode="31d">直近31日</button>
        <button class="btn secondary" data-mode="week">週次</button>
        <button class="btn secondary" data-mode="month">月次</button>
      </div>
    </div>
    <div id="chartsContainer">
      <div class="charts-row">
        <div class="chart-box"><canvas id="sleepChart"></canvas></div>
        <div class="chart-box"><canvas id="stepsChart"></canvas></div>
      </div>
    </div>
    <div class="import-row">
      <button class="btn secondary" id="saveChartImageBtn">🖼 グラフを画像保存</button>
      <label class="btn secondary">睡眠CSVインポート<input type="file" id="sleepCsvInput" accept=".csv"></label>
      <label class="btn secondary">歩数CSVインポート<input type="file" id="stepsCsvInput" accept=".csv"></label>
    </div>
    <div class="hint">CSVは date/day/timestamp 列 と duration(分)/sleep/steps 列を自動検出します。</div>
  </div>
</div>

<footer>通院メモ &middot; データは Neon PostgreSQL に保存されます</footer>

<script>
const TEMPLATE = `## 生活変化

## 体調

## 今後の意向

## 質問・相談・依頼
`;

const state = {
  selectedDate: fmtDate(new Date()),
  entries: [],
  entriesByDate: {},
  vitals: { sleep: [], steps: [] },
  vitalsMode: '31d',
  editMode: true,
  currentMemoId: null,
};

let sleepChart, stepsChart;

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}

// ---------------------------------------------------------------------
// Networking + offline cache
// ---------------------------------------------------------------------

async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GET ${url} failed: ${res.status}`);
  return res.json();
}

async function loadEntries() {
  try {
    const entries = await apiGet('/api/memo?limit=200');
    state.entries = entries;
    state.entriesByDate = {};
    entries.forEach(m => { state.entriesByDate[m.date] = m; });
    localStorage.setItem('cache:entries', JSON.stringify(entries));
    setStatus('オンライン', false);
  } catch (e) {
    console.warn('offline, using cache', e);
    const cached = JSON.parse(localStorage.getItem('cache:entries') || '[]');
    state.entries = cached;
    state.entriesByDate = {};
    cached.forEach(m => { state.entriesByDate[m.date] = m; });
    setStatus('オフライン（キャッシュ表示）', true);
  }
  renderEntryList();
}

function setStatus(text, offline) {
  const badge = document.getElementById('statusBadge');
  badge.textContent = text;
  badge.classList.toggle('offline', !!offline);
}

function draftKey(dateStr) {
  return `draft:${dateStr}`;
}

function saveDraft(dateStr, data) {
  localStorage.setItem(draftKey(dateStr), JSON.stringify({ ...data, savedAt: Date.now() }));
}

function getDraft(dateStr) {
  const raw = localStorage.getItem(draftKey(dateStr));
  return raw ? JSON.parse(raw) : null;
}

function clearDraft(dateStr) {
  localStorage.removeItem(draftKey(dateStr));
}

async function syncPendingDrafts() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('draft:'));
  for (const key of keys) {
    const dateStr = key.slice('draft:'.length);
    const draft = JSON.parse(localStorage.getItem(key));
    try {
      const res = await fetch('/api/memo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date: dateStr,
          is_clinic_day: draft.is_clinic_day,
          summary: draft.summary,
          content: draft.content,
        }),
      });
      if (res.ok) clearDraft(dateStr);
    } catch (e) {
      break; // still offline, stop trying
    }
  }
  loadEntries();
}

window.addEventListener('online', () => { setStatus('オンライン', false); syncPendingDrafts(); });
window.addEventListener('offline', () => setStatus('オフライン', true));

// ---------------------------------------------------------------------
// Entry list
// ---------------------------------------------------------------------

function renderEntryList() {
  const list = document.getElementById('entryList');
  list.innerHTML = '';

  if (!state.entries.length) {
    list.innerHTML = '<div class="entry-empty">まだエントリがありません。日付を選んで作成してください。</div>';
    return;
  }

  state.entries.forEach(m => {
    const row = document.createElement('div');
    row.className = 'entry-row';
    if (m.date === state.selectedDate) row.classList.add('selected');

    const top = document.createElement('div');
    top.className = 'entry-top';
    top.innerHTML = `<span>${m.date}</span>` + (m.is_clinic_day ? '<span class="badge-clinic">通院日</span>' : '');
    row.appendChild(top);

    if (m.summary) {
      const summary = document.createElement('div');
      summary.className = 'entry-summary';
      summary.textContent = m.summary;
      row.appendChild(summary);
    }

    row.addEventListener('click', () => selectDate(m.date));
    list.appendChild(row);
  });
}

function selectDate(dateStr) {
  state.selectedDate = dateStr;
  document.getElementById('jumpDateInput').value = dateStr;
  renderEntryList();
  loadEditorForSelectedDate();
}

function loadEditorForSelectedDate() {
  const dateStr = state.selectedDate;
  document.getElementById('selectedDateLabel').textContent = dateStr;
  const memo = state.entriesByDate[dateStr];
  const draft = getDraft(dateStr);

  const base = draft || memo || { is_clinic_day: false, summary: '', content: '' };
  state.currentMemoId = memo ? memo.id : null;

  document.getElementById('clinicDayCheck').checked = !!base.is_clinic_day;
  document.getElementById('summaryInput').value = base.summary || '';
  document.getElementById('contentEdit').value = base.content || '';

  setSaveStatus(draft ? '未保存の下書きがあります' : '');
  updatePreview();
}

document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = document.getElementById('jumpDateInput').value;
  if (v) selectDate(v);
});

// ---------------------------------------------------------------------
// Editor
// ---------------------------------------------------------------------

function updatePreview() {
  const content = document.getElementById('contentEdit').value;
  document.getElementById('contentView').innerHTML = content.trim()
    ? marked.parse(content)
    : '<p style="color:#999;">（内容なし）</p>';
}

function setEditMode(edit) {
  state.editMode = edit;
  document.getElementById('contentEdit').style.display = edit ? 'block' : 'none';
  document.getElementById('contentView').style.display = edit ? 'none' : 'block';
  document.getElementById('toggleModeBtn').textContent = edit ? 'プレビュー' : '編集';
  if (!edit) updatePreview();
}

function setSaveStatus(text) {
  document.getElementById('saveStatus').textContent = text;
}

function currentFormData() {
  return {
    is_clinic_day: document.getElementById('clinicDayCheck').checked,
    summary: document.getElementById('summaryInput').value,
    content: document.getElementById('contentEdit').value,
  };
}

function scheduleDraftSave() {
  saveDraft(state.selectedDate, currentFormData());
  setSaveStatus('下書きを保存しました（未同期）');
}

let draftTimer = null;
function onFormInput() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(scheduleDraftSave, 400);
}

document.getElementById('clinicDayCheck').addEventListener('change', onFormInput);
document.getElementById('summaryInput').addEventListener('input', onFormInput);
document.getElementById('contentEdit').addEventListener('input', onFormInput);

document.getElementById('toggleModeBtn').addEventListener('click', () => setEditMode(!state.editMode));

document.getElementById('templateBtn').addEventListener('click', () => {
  const el = document.getElementById('contentEdit');
  if (!el.value.trim()) {
    el.value = TEMPLATE;
  } else {
    el.value += (el.value.endsWith('\n') ? '' : '\n') + '\n' + TEMPLATE;
  }
  onFormInput();
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const dateStr = state.selectedDate;
  const payload = { date: dateStr, ...currentFormData() };
  try {
    const res = await fetch('/api/memo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    const memo = await res.json();
    state.entriesByDate[dateStr] = memo;
    if (!state.entries.some(m => m.date === dateStr)) {
      state.entries.unshift(memo);
      state.entries.sort((a, b) => b.date.localeCompare(a.date));
    } else {
      state.entries = state.entries.map(m => m.date === dateStr ? memo : m);
    }
    state.currentMemoId = memo.id;
    clearDraft(dateStr);
    setSaveStatus('保存しました ✓');
    renderEntryList();
    renderCharts();
  } catch (e) {
    saveDraft(dateStr, currentFormData());
    setSaveStatus('オフラインのため下書き保存しました');
  }
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  const dateStr = state.selectedDate;
  if (!confirm(`${dateStr} のメモを削除しますか？`)) return;
  clearDraft(dateStr);
  const memo = state.entriesByDate[dateStr];
  if (memo) {
    try {
      await fetch(`/api/memo/${memo.id}`, { method: 'DELETE' });
      delete state.entriesByDate[dateStr];
      state.entries = state.entries.filter(m => m.date !== dateStr);
    } catch (e) {
      setSaveStatus('オフラインのため削除できませんでした');
      return;
    }
  }
  document.getElementById('clinicDayCheck').checked = false;
  document.getElementById('summaryInput').value = '';
  document.getElementById('contentEdit').value = '';
  setSaveStatus('削除しました');
  renderEntryList();
  renderCharts();
  updatePreview();
});

// ---------------------------------------------------------------------
// Charts
// ---------------------------------------------------------------------

function weekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const offset = (d.getDay() + 6) % 7; // Monday = 0
  d.setDate(d.getDate() - offset);
  return fmtDate(d);
}

function monthStart(dateStr) {
  return dateStr.slice(0, 7) + '-01';
}

function shortLabel(dateStr) {
  const [, m, d] = dateStr.split('-');
  return `${Number(m)}/${Number(d)}`;
}

function monthLabel(dateStr) {
  const [y, m] = dateStr.split('-');
  return `${y}/${Number(m)}`;
}

function vitalsRangeForMode(mode) {
  const end = fmtDate(new Date());
  if (mode === '31d') return { start: addDays(end, -30), end };
  if (mode === 'week') return { start: addDays(end, -7 * 12 + 1), end };
  return { start: addDays(end, -365), end }; // month: ~12 months back
}

function buildSeries(rawRows, dateField, valueField, mode, clinicDates, convertFn) {
  if (mode === '31d') {
    const byDate = {};
    rawRows.forEach(r => { byDate[r[dateField]] = r[valueField]; });
    const { start, end } = vitalsRangeForMode(mode);
    const labels = [];
    const values = [];
    const colors = [];
    let d = start;
    while (d <= end) {
      labels.push(shortLabel(d));
      const raw = byDate[d];
      values.push(raw !== undefined ? convertFn(raw) : 0);
      colors.push(clinicDates.has(d) ? '#e0793a' : null);
      d = addDays(d, 1);
    }
    return { labels, values, colors };
  }

  const groupFn = mode === 'week' ? weekStart : monthStart;
  const labelFn = mode === 'week' ? shortLabel : monthLabel;
  const buckets = {}; // key -> { sum, count, clinic }

  rawRows.forEach(r => {
    const key = groupFn(r[dateField]);
    if (!buckets[key]) buckets[key] = { sum: 0, count: 0, clinic: false };
    buckets[key].sum += r[valueField];
    buckets[key].count += 1;
  });
  clinicDates.forEach(cd => {
    const key = groupFn(cd);
    if (buckets[key]) buckets[key].clinic = true;
  });

  const keys = Object.keys(buckets).sort();
  return {
    labels: keys.map(labelFn),
    values: keys.map(k => convertFn(buckets[k].count ? buckets[k].sum / buckets[k].count : 0)),
    colors: keys.map(k => buckets[k].clinic ? '#e0793a' : null),
  };
}

function renderCharts() {
  const { start, end } = vitalsRangeForMode(state.vitalsMode);
  const clinicDates = new Set(
    state.entries.filter(m => m.is_clinic_day && m.date >= start && m.date <= end).map(m => m.date)
  );

  const sleepSeries = buildSeries(state.vitals.sleep, 'date', 'duration', state.vitalsMode, clinicDates, v => +(v / 60).toFixed(1));
  const stepsSeries = buildSeries(state.vitals.steps, 'date', 'steps', state.vitalsMode, clinicDates, v => Math.round(v));

  const defaultSleepColor = '#3a6ea5';
  const defaultStepsColor = '#4a9e6f';

  if (sleepChart) sleepChart.destroy();
  if (stepsChart) stepsChart.destroy();

  const modeTitle = state.vitalsMode === '31d' ? '' : state.vitalsMode === 'week' ? '（週平均）' : '（月平均）';

  sleepChart = new Chart(document.getElementById('sleepChart'), {
    type: 'bar',
    data: {
      labels: sleepSeries.labels,
      datasets: [{
        label: '睡眠(時間)',
        data: sleepSeries.values,
        backgroundColor: sleepSeries.colors.map(c => c || defaultSleepColor),
      }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, title: { display: true, text: `睡眠時間${modeTitle}` } },
      scales: { y: { beginAtZero: true } },
    },
  });

  stepsChart = new Chart(document.getElementById('stepsChart'), {
    type: 'bar',
    data: {
      labels: stepsSeries.labels,
      datasets: [{
        label: '歩数',
        data: stepsSeries.values,
        backgroundColor: stepsSeries.colors.map(c => c || defaultStepsColor),
      }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, title: { display: true, text: `歩数${modeTitle}` } },
      scales: { y: { beginAtZero: true } },
    },
  });
}

async function loadVitals() {
  const { start, end } = vitalsRangeForMode(state.vitalsMode);
  const cacheK = `cache:vitals:${state.vitalsMode}`;
  try {
    const vitals = await apiGet(`/api/vitals?start=${start}&end=${end}`);
    state.vitals = vitals;
    localStorage.setItem(cacheK, JSON.stringify(vitals));
  } catch (e) {
    state.vitals = JSON.parse(localStorage.getItem(cacheK) || '{"sleep":[],"steps":[]}');
  }
  renderCharts();
}

document.querySelectorAll('.period-toggle [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.vitalsMode = btn.dataset.mode;
    document.querySelectorAll('.period-toggle [data-mode]').forEach(b => b.classList.toggle('active', b === btn));
    loadVitals();
  });
});

document.getElementById('saveChartImageBtn').addEventListener('click', () => {
  html2canvas(document.getElementById('chartsContainer')).then(canvas => {
    const link = document.createElement('a');
    link.download = `vitals_${state.vitalsMode}_${fmtDate(new Date())}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

// ---------------------------------------------------------------------
// CSV import
// ---------------------------------------------------------------------

async function importCsv(inputEl, type) {
  const file = inputEl.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  form.append('type', type);
  try {
    const res = await fetch('/api/vitals/import-csv', { method: 'POST', body: form });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'import failed');
    alert(`${result.imported}件インポートしました（${result.skipped}件スキップ）`);
    loadVitals();
  } catch (e) {
    alert('インポートに失敗しました: ' + e.message);
  }
  inputEl.value = '';
}

document.getElementById('sleepCsvInput').addEventListener('change', e => importCsv(e.target, 'sleep'));
document.getElementById('stepsCsvInput').addEventListener('change', e => importCsv(e.target, 'steps'));
